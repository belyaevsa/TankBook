name: backend

on:
  push:
    paths:
      - 'backend/**'
      # The API embeds ../../../docs/schemas/v1/*.schema.json (migration 002
      # inserts them into payload_schemas), so a schema change alters the built
      # image without touching backend/. Without this line the deploy silently
      # ships the previous schema registry.
      - 'docs/schemas/**'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/schemas/**'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# One run at a time on the deploy host: two runs racing the handover would fight
# over the serving port, and the suite's Testcontainers would fight over the
# machine. `cancel-in-progress: false` because cancelling mid-handover could
# leave neither colour holding the port.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # PULL REQUESTS RUN ON A GITHUB-HOSTED RUNNER, NEVER THE SELF-HOSTED ONE.
  #
  # belyaevsa/TankBook is PUBLIC. A `pull_request` job on the self-hosted runner
  # executes the PR author's code on the deploy host - any stranger could open a
  # PR whose build step reads the runner token, the deploy directory, or the
  # containers holding the production database credential. GitHub's own guidance
  # is not to pair self-hosted runners with public repos for exactly this reason,
  # and deploy-landing.yml already splits the same way.
  #
  # So a PR gets the full gate on disposable infrastructure, and no host access.
  # ---------------------------------------------------------------------------
  pr-gate:
    name: Build and gate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate appsettings from templates
        run: bash scripts/generate-appsettings.sh

      - name: Build
        run: dotnet build Tankbook.slnx --configuration Release

      - name: Test
        run: dotnet test Tankbook.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Build the container image
        working-directory: .
        run: docker build -f backend/Dockerfile -t tankbook-api:pr .

  # ---------------------------------------------------------------------------
  # Push builds, gates AND deploys in ONE job on the self-hosted runner - the
  # shape deploy-landing.yml already uses. Same machine, so there is no artifact
  # round-trip and the bytes that passed the suite are literally the bytes that
  # get run; a build/deploy split across runners can ship an artifact nobody
  # re-checked.
  #
  # The deploy steps are gated on main. A push to any other branch builds and
  # tests here and stops - which is safe, because a branch of THIS repo is our
  # own code, unlike a fork's pull request.
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Build, gate and deploy
    if: github.event_name != 'pull_request'
    # PINNED TO ONE MACHINE, deliberately, and it takes all three labels.
    #
    # `runs-on` cannot name a runner - GitHub matches on labels only - so the
    # host-specific `secondary-tankbook-api` label is what makes this "that
    # runner and no other". It matters because this job is not portable: it owns
    # the serving port 17080, the state in /opt/tankbook/api and the blue/green
    # containers. A second runner carrying `tankbook-api` would be an eligible
    # target and would deploy into a machine holding none of that, while nginx
    # kept proxying to the old host.
    #
    # `tankbook-api` points the other way - it keeps deploy-landing.yml's bare
    # `self-hosted` from landing HERE, on a machine with no Hugo.
    #
    # Moving hosts means changing this line and the runner's labels together;
    # backend/scripts/install-runner.sh registers the name as a label for exactly
    # this purpose.
    runs-on: [self-hosted, tankbook-api]
    steps:
      - uses: actions/checkout@v4

      - name: Assert the runner has what this job needs
        # Asserted, never assumed. The runner is a machine somebody configured by
        # hand; a missing tool otherwise surfaces as a confusing failure three
        # steps later, and a missing `docker` would surface as a failed DEPLOY
        # after a green test run. Each message names the fix (hard rule 7 applies
        # to operators too).
        run: |
          set -euo pipefail
          fail=0
          for tool in dotnet docker curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::${tool} is not installed on this runner"
              fail=1
            fi
          done
          docker info >/dev/null 2>&1 || {
            echo "::error::the runner user cannot talk to docker - add it to the docker group"
            fail=1
          }
          # The suite uses Testcontainers for Postgres and the deploy writes here.
          mkdir -p /opt/tankbook/api 2>/dev/null || {
            echo "::error::/opt/tankbook/api is not writable by the runner user"
            fail=1
          }
          [ "$fail" -eq 0 ] || exit 1
          dotnet --version
          docker --version

      - name: Generate appsettings from templates
        # Gitignored and generated. Measured: with appsettings.json absent
        # `dotnet test` ABORTS after 117 of 295 tests. No secrets here - the
        # suite runs in the "Testing" environment and passes with every value
        # blank; the real values reach the CONTAINER, not this checkout.
        working-directory: backend
        run: bash scripts/generate-appsettings.sh

      - name: Build
        working-directory: backend
        run: dotnet build Tankbook.slnx --configuration Release

      - name: Test
        # The full suite on the deploy host, before anything is built or shipped.
        # Testcontainers needs the docker access asserted above; without it the
        # Postgres-backed tests SKIP rather than fail, so the count is checked
        # below rather than trusting a green run.
        working-directory: backend
        run: dotnet test Tankbook.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Assert the database-backed tests actually ran
        # A suite that skips its 153 Postgres tests still prints "Passed!". That
        # is the failure this checks for: on a runner without working docker the
        # gate would quietly shrink to the half that needs no database, and the
        # deploy below would proceed on it.
        working-directory: backend
        run: |
          set -euo pipefail
          trx=$(find . -name results.trx | head -1)
          [ -n "$trx" ] || { echo "::error::no test results file"; exit 1; }
          skipped=$(grep -o 'total="[0-9]*" executed="[0-9]*" passed="[0-9]*"[^>]*' "$trx" | head -1 || true)
          echo "counters: ${skipped:-unknown}"
          notexecuted=$(grep -o 'notExecuted="[0-9]*"' "$trx" | head -1 | grep -o '[0-9]*' || echo 0)
          if [ "${notexecuted:-0}" -gt 0 ]; then
            echo "::error::${notexecuted} tests were skipped - Testcontainers could not start Postgres on this runner, so the database half of the suite did not run"
            exit 1
          fi

      - name: Verify formatting
        working-directory: backend
        run: dotnet format --verify-no-changes

      - name: Build the image on this host
        # Tagged with the commit, never `latest`: the running container then
        # names the commit it came from, and the previous image stays on disk as
        # the rollback target. Context is the REPO ROOT - the csproj embeds files
        # outside backend/.
        run: docker build -f backend/Dockerfile -t "tankbook-api:${GITHUB_SHA::7}" .

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        # Migrations run as their own step inside this script, before any
        # container is replaced, and the new image is health-checked on a scratch
        # port before the serving port changes hands. A failure at either point
        # leaves the current version serving.
        #
        # nginx is external and unmanaged: it proxies to a fixed port on this
        # host and is never touched here. The handover therefore refuses
        # connections for roughly half a second - measured, not estimated.
        env:
          POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          TANKBOOK_HASH_SALT: ${{ secrets.TANKBOOK_HASH_SALT }}
          CONFIG_SIGNING_KEY: ${{ secrets.CONFIG_SIGNING_KEY }}
          AUTH_JWT_SIGNING_KEY: ${{ secrets.AUTH_JWT_SIGNING_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          APPLE_AUDIENCE: ${{ vars.APPLE_AUDIENCE }}
          GOOGLE_AUDIENCE: ${{ vars.GOOGLE_AUDIENCE }}
        run: bash backend/scripts/deploy-blue-green.sh "${GITHUB_SHA::7}"

      - name: Report what is serving
        if: always() && github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Backend deploy"
            echo '```'
            cat /opt/tankbook/api/active 2>/dev/null || echo "no active marker"
            docker ps --filter 'name=tankbook-api-' --format '{{.Names}} {{.Status}} {{.Ports}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
