name: backend

on:
  push:
    paths:
      - 'backend/**'
      # The API embeds ../../../docs/schemas/v1/*.schema.json (migration 002
      # inserts them into payload_schemas), so a schema change alters the built
      # image without touching backend/. Without this line the deploy silently
      # ships the previous schema registry.
      - 'docs/schemas/**'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/schemas/**'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# One run at a time on the deploy host: two runs racing the handover would fight
# over the serving port, and the suite's Testcontainers would fight over the
# machine. `cancel-in-progress: false` because cancelling mid-handover could
# leave neither colour holding the port.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # PULL REQUESTS RUN ON A GITHUB-HOSTED RUNNER, NEVER THE SELF-HOSTED ONE.
  #
  # belyaevsa/TankBook is PUBLIC. A `pull_request` job on the self-hosted runner
  # executes the PR author's code on the deploy host - any stranger could open a
  # PR whose build step reads the runner token, the deploy directory, or the
  # containers holding the production database credential. GitHub's own guidance
  # is not to pair self-hosted runners with public repos for exactly this reason,
  # and deploy-landing.yml already splits the same way.
  #
  # So a PR gets the full gate on disposable infrastructure, and no host access.
  # ---------------------------------------------------------------------------
  pr-gate:
    name: Build and gate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate appsettings from templates
        run: bash scripts/generate-appsettings.sh

      - name: Build
        run: dotnet build Tankbook.slnx --configuration Release

      - name: Test
        run: dotnet test Tankbook.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Build the container image
        working-directory: .
        run: docker build -f backend/Dockerfile -t tankbook-api:pr .

  # ---------------------------------------------------------------------------
  # BUILD HOST. Gates the code and pushes an image to Yandex Container Registry.
  # It never touches production - no database credential, no serving port, no
  # deploy directory - which is the point of the split (2026-09-02).
  #
  # The cost of splitting, stated because it was the argument against: the bytes
  # that passed the suite are no longer trivially the bytes that run. The image
  # DIGEST is what closes that gap - the deploy pulls by the tag this job pushed
  # and prints the digest, so the two can be compared rather than assumed.
  #
  # The full suite runs HERE rather than on the deploy host. That is not only
  # tidiness: on 2026-09-02 the suite took 6m21s on the deploy host and two tests
  # timed out against Postgres, because ~20 test classes run in parallel, each
  # creating a database and applying all 12 migrations, while the host was also
  # serving. Nothing was wrong with the code.
  # ---------------------------------------------------------------------------
  build:
    name: Build, gate and push
    if: github.event_name != 'pull_request'
    # PINNED TO ONE MACHINE, deliberately, and it takes all three labels.
    #
    # `runs-on` cannot name a runner - GitHub matches on labels only - so the
    # host-specific `secondary-tankbook-api` label is what makes this "that
    # runner and no other". It matters because this job is not portable: it owns
    # the serving port 17080, the state in /opt/tankbook/api and the blue/green
    # containers. A second runner carrying `tankbook-api` would be an eligible
    # target and would deploy into a machine holding none of that, while nginx
    # kept proxying to the old host.
    #
    # `tankbook-api` points the other way - it keeps deploy-landing.yml's bare
    # `self-hosted` from landing HERE, on a machine with no Hugo.
    #
    # Moving hosts means changing this line and the runner's labels together;
    # backend/scripts/install-runner.sh registers the name as a label for exactly
    # this purpose.
    # ONE HOST FOR NOW (2026-09-02): build and deploy are separate JOBS but the
    # same machine, so this carries the same host-specific label as the deploy.
    # Splitting onto a dedicated builder later is a one-line change here plus a
    # label on that runner - nothing else, because the image already travels
    # through the registry when one is configured.
    # ITS OWN HOST (2026-09-03), and a DIFFERENT ARCHITECTURE: this builder is
    # aarch64 while the deploy host is x86_64, which is why the image build below
    # is explicitly --platform linux/amd64.
    #
    # It moved off the deploy machine because that machine OOM-killed its runner
    # and timed tests out three times while also serving api.tankbook.live. The
    # suite creates 178 databases and runs ~2,100 migrations per pass; that does
    # not belong on the box answering production traffic.
    runs-on: [self-hosted, tankbook-build]
    steps:
      - uses: actions/checkout@v4

      - name: Assert the runner has what this job needs
        # Asserted, never assumed. The runner is a machine somebody configured by
        # hand; a missing tool otherwise surfaces as a confusing failure three
        # steps later, and a missing `docker` would surface as a failed DEPLOY
        # after a green test run. Each message names the fix (hard rule 7 applies
        # to operators too).
        run: |
          set -euo pipefail
          fail=0
          for tool in dotnet docker curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::${tool} is not installed on this runner"
              fail=1
            fi
          done
          docker info >/dev/null 2>&1 || {
            echo "::error::the runner user cannot talk to docker - add it to the docker group"
            fail=1
          }
          [ "$fail" -eq 0 ] || exit 1
          dotnet --version
          docker --version

      - name: Generate appsettings from templates
        # Gitignored and generated. Measured: with appsettings.json absent
        # `dotnet test` ABORTS after 117 of 295 tests. No secrets here - the
        # suite runs in the "Testing" environment and passes with every value
        # blank; the real values reach the CONTAINER, not this checkout.
        working-directory: backend
        run: bash scripts/generate-appsettings.sh

      - name: Build
        working-directory: backend
        run: dotnet build Tankbook.slnx --configuration Release

      - name: Test
        # The full suite on the deploy host, before anything is built or shipped.
        # Testcontainers needs the docker access asserted above; without it the
        # Postgres-backed tests SKIP rather than fail, so the count is checked
        # below rather than trusting a green run.
        working-directory: backend
        # Capped for MEMORY as much as for time. On 2026-09-02 this host
        # OOM-killed the runner mid-job (unit peak 1.2 GB) while also serving the
        # API and running Postgres; an earlier run had timed out against Postgres
        # for the same underlying reason. Each parallel thread carries a
        # WebApplicationFactory, its own connection pools and a fresh migrated
        # database.
        #
        # DOTNET_gcServer=0 is the bigger lever: server GC allocates a heap per
        # logical core and holds memory for throughput, which is the wrong trade
        # for a test run on a shared box. Neither setting is a fix for the real
        # problem - the full suite does not belong on the machine that serves
        # production - they buy room until the build moves to its own host.
        env:
          DOTNET_gcServer: '0'
        run: >
          dotnet test Tankbook.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          -- xUnit.MaxParallelThreads=${XUNIT_THREADS:-2}

      - name: Assert the database-backed tests actually ran
        # The failure this exists for: without working docker the ~153
        # Postgres-backed tests report as skipped and `dotnet test` still prints
        # "Passed!" - the gate silently shrinks to the half that needs no
        # database, and the deploy proceeds on it.
        #
        # It is a TOLERANCE, not zero, and that is the correction of an earlier
        # version. Failing on any skip at all made this fire on a single
        # transient one (2026-09-02: one SkippableFact skipped while the other
        # 294 ran, because Testcontainers was briefly unreachable under load) -
        # a red deploy with nothing wrong. A wholesale skip is ~153; a handful is
        # noise. The tolerance separates them, and the count is always printed so
        # a creeping number is visible before it reaches the limit.
        working-directory: backend
        run: |
          set -euo pipefail
          trx=$(find . -name results.trx | head -1)
          [ -n "$trx" ] || { echo "::error::no test results file"; exit 1; }
          counters=$(grep -o '<Counters[^>]*' "$trx" | head -1)
          echo "$counters"
          skipped=$(printf '%s' "$counters" | grep -o 'notExecuted="[0-9]*"' | grep -o '[0-9]*' || echo 0)
          executed=$(printf '%s' "$counters" | grep -o ' executed="[0-9]*"' | grep -o '[0-9]*' || echo 0)
          tolerance=10
          if [ "${skipped:-0}" -gt "$tolerance" ]; then
            echo "::error::${skipped} tests were skipped (tolerance ${tolerance}). That is the shape of Testcontainers failing to start Postgres, so the database half of the suite did not run and this deploy would ship on an untested gate."
            exit 1
          fi
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning::${skipped} test(s) skipped of ${executed} executed - under the tolerance, but worth watching."
          fi

      - name: Verify formatting
        working-directory: backend
        run: dotnet format --verify-no-changes

      - name: Build and push the image
        # Tagged with the commit, never `latest`: the running container then
        # names the commit it came from, and the previous tag stays in the
        # registry as the rollback target. Context is the REPO ROOT - the csproj
        # embeds files outside backend/.
        #
        # Registry auth uses the service account's authorized key as the
        # `json_key` docker user, which is Yandex's documented CI path and needs
        # no yc CLI on the runner. The key is piped on stdin, never in argv.
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YC_CI_SA_KEY: ${{ secrets.YC_CI_SA_KEY }}
        run: |
          set -euo pipefail
          # The registry is REQUIRED now: build and deploy are different hosts,
          # so the image has to travel. It is also built for linux/amd64
          # explicitly - the builder is aarch64 and the deploy host is x86_64,
          # and a natively-built image fails at `docker run` with `exec format
          # error` AFTER a green build and a successful push.
          #
          # --push rather than build-then-push: buildx cross-platform output does
          # not land in the local image store, so `docker push` afterwards would
          # not find it.
          if [ -n "$YC_REGISTRY_ID" ] && [ -n "$YC_CI_SA_KEY" ]; then
            image="cr.yandex/${YC_REGISTRY_ID}/tankbook-api:${GITHUB_SHA::7}"
            printf '%s' "$YC_CI_SA_KEY" | docker login --username json_key --password-stdin cr.yandex
            docker buildx build --platform linux/amd64 \
              -f backend/Dockerfile -t "$image" --push .
            # The digest makes the handoff checkable: the deploy prints what it
            # pulled, so "the tested bytes ran" is verifiable rather than assumed
            # - the one thing the single-JOB shape used to give for free.
            echo "pushed $(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_STEP_SUMMARY"
            docker logout cr.yandex
          else
            echo "::error::YC_REGISTRY_ID and YC_CI_SA_KEY are required now that build and deploy are on DIFFERENT hosts - the image has nowhere to travel otherwise."
            exit 1
          fi


  # ---------------------------------------------------------------------------
  # DEPLOY HOST. Pulls the image the build job pushed and hands it the serving
  # port. It never compiles anything - no SDK needed, no source build - so the
  # only thing that reaches production is an image that already passed the gate.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # PINNED TO ONE MACHINE. `runs-on` cannot name a runner - GitHub matches on
    # labels only - so the host-specific label is what makes this "that runner
    # and no other". This job is not portable: it owns the serving port 17080,
    # the state in /opt/tankbook/api and the blue/green containers. A second
    # runner carrying `tankbook-api` would be an eligible target and would deploy
    # into a machine holding none of that, while nginx kept proxying here.
    # The DEPLOY host: x86_64, owns port 17080, /opt/tankbook/api and the
    # blue/green containers. Pinned by its own label so no other runner can be
    # chosen for it.
    runs-on: [self-hosted, tankbook-api, secondary-tankbook-api]
    steps:
      - uses: actions/checkout@v4

      - name: Assert the deploy host has what it needs
        run: |
          set -euo pipefail
          fail=0
          for tool in docker curl; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::${tool} is not installed on this runner"; fail=1; }
          done
          docker info >/dev/null 2>&1 || { echo "::error::the runner user cannot talk to docker - add it to the docker group"; fail=1; }
          mkdir -p /opt/tankbook/api 2>/dev/null || { echo "::error::/opt/tankbook/api is not writable by the runner user"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      - name: Deploy
        # Migrations run as their own step inside this script, before any
        # container is replaced, and the image is health-checked on a scratch
        # port before the serving port changes hands. A failure at either point
        # leaves the current version serving.
        #
        # nginx is external and unmanaged: it proxies to a fixed port on this
        # host and is never touched here. The handover refuses connections for
        # roughly half a second - measured, not estimated.
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          TANKBOOK_HASH_SALT: ${{ secrets.TANKBOOK_HASH_SALT }}
          CONFIG_SIGNING_KEY: ${{ secrets.CONFIG_SIGNING_KEY }}
          AUTH_JWT_SIGNING_KEY: ${{ secrets.AUTH_JWT_SIGNING_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          APPLE_AUDIENCE: ${{ vars.APPLE_AUDIENCE }}
          GOOGLE_AUDIENCE: ${{ vars.GOOGLE_AUDIENCE }}
          YC_DEPLOY_SA_KEY: ${{ secrets.YC_DEPLOY_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${YC_REGISTRY_ID:-}" ] && [ -n "${YC_DEPLOY_SA_KEY:-}" ]; then
            printf '%s' "$YC_DEPLOY_SA_KEY" | docker login --username json_key --password-stdin cr.yandex
            export TANKBOOK_IMAGE_REPO="cr.yandex/${YC_REGISTRY_ID}/tankbook-api"
          else
            echo "::error::YC_REGISTRY_ID and YC_DEPLOY_SA_KEY are required - the image is built on another host and can only arrive through the registry."
            exit 1
          fi
          bash backend/scripts/deploy-blue-green.sh "${GITHUB_SHA::7}"
          docker logout cr.yandex 2>/dev/null || true

      - name: Report what is serving
        if: always()
        run: |
          {
            echo "### Backend deploy"
            echo '```'
            cat /opt/tankbook/api/active 2>/dev/null || echo "no active marker"
            docker ps --filter 'name=tankbook-api-' --format '{{.Names}} {{.Status}} {{.Ports}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
