name: Deploy landing -> tankbook.live

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # The screenshot corpus is MOUNTED into the site by hugo.toml
      # (../design/screenshots -> assets/screenshots), so a re-shot capture
      # changes the built page without touching site/. Without this line the
      # deploy silently keeps serving the previous image.
      - 'design/screenshots/**'
      - 'design/tokens.json'
      - 'scripts/check-site.sh'
      - 'scripts/generate-site-tokens.swift'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'design/screenshots/**'
      - 'design/tokens.json'
      - 'scripts/check-site.sh'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

# A path filter is not optional here. The iOS workflow triggered on every push
# with no filter, hung for hours on a 10x-billed runner, and had to be disabled
# (HANDOVER.md). backend.yml gets this right; so does this.

concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.153.4'

jobs:
  # ---------------------------------------------------------------------------
  # PR validation runs on a GitHub-hosted runner, NEVER the self-hosted one.
  #
  # belyaevsa/TankBook is a PUBLIC repository. A `pull_request` job on a
  # self-hosted runner executes the PR author's code on our own machine - any
  # stranger could open a PR whose build step reads the deploy directory, the
  # runner's token, or anything else on that host. GitHub's own guidance is not
  # to pair self-hosted runners with public repos for exactly this reason.
  # So PRs get the full gate, on disposable infrastructure, and no server access.
  # ---------------------------------------------------------------------------
  pr-gate:
    name: Build and gate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo (extended, pinned)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Assert the Hugo version
        run: |
          hugo version
          hugo version | grep -q "v${HUGO_VERSION}" || {
            echo "::error::Hugo is not v${HUGO_VERSION}. The layouts need the 0.146+ flattened structure; an older Hugo renders a wrong page without failing."
            exit 1
          }

      - name: Build
        working-directory: site
        run: hugo --minify --gc --cleanDestinationDir

      - name: Assert the build produced a site
        run: |
          test -s site/public/index.html    || { echo "::error::no EN index.html"; exit 1; }
          test -s site/public/ru/index.html || { echo "::error::no RU index.html"; exit 1; }
          count=$(find site/public -type f | wc -l)
          echo "built $count files"
          [ "$count" -ge 20 ] || { echo "::error::only $count files built - refusing to call that a site"; exit 1; }

      - name: Run the site gate
        run: bash scripts/check-site.sh

  # ---------------------------------------------------------------------------
  # Push to main builds and deploys in ONE job on the self-hosted runner.
  # Same machine, so there is no artifact round-trip and the bytes that were
  # gated are literally the bytes that get published - a build/deploy split
  # across runners can publish an artifact nobody re-checked.
  # ---------------------------------------------------------------------------
  deploy:
    name: Build, gate and deploy
    if: github.event_name != 'pull_request'
    # PINNED TO THE PROXY HOST, by LABEL. The runner is NAMED `vm-proxy` but
    # carries the label `tankbook-deploy`, and `runs-on` matches labels only -
    # never names. A first pass here used `vm-proxy` and would have queued this
    # job forever against a label no runner has, which is the failure backend.yml
    # already warns about two files away. Verified against the live list:
    #   vm-proxy -> self-hosted, Linux, X64, tankbook-deploy
    #
    # It matters because this job is not portable: it writes releases into
    # /opt/tankbook and flips the `latest` symlink nginx serves from.
    #
    # This replaces a bare `self-hosted`, which was a live hazard rather than a
    # tidiness issue: backend.yml notes that `tankbook-api` exists partly "to
    # keep deploy-landing.yml's bare `self-hosted` from landing HERE, on a
    # machine with no Hugo". With three runners registered, the bare label made
    # the build host and the API host both eligible - the site would deploy into
    # a machine nobody serves from, the job would report success, and
    # tankbook.live would keep serving the previous release.
    runs-on: [self-hosted, tankbook-deploy]
    env:
      DEPLOY_ROOT: /opt/tankbook
    steps:
      - uses: actions/checkout@v4

      - name: Assert the Hugo version
        # The runner supplies Hugo. Asserted rather than assumed: the layouts use
        # the 0.146+ flattened structure (layouts/_partials, home.html, no
        # _default/), and an older Hugo does not error - it fails to find them
        # and renders an empty or wrong page, which every later step would then
        # report as a successful deploy.
        run: |
          command -v hugo >/dev/null 2>&1 || { echo "::error::hugo is not installed on this runner"; exit 1; }
          hugo version
          hugo version | grep -q "v${HUGO_VERSION}" || {
            echo "::error::Hugo is not v${HUGO_VERSION} on this runner. Older versions render the wrong page without failing."
            exit 1
          }

      - name: Check the generated design tokens are in sync
        # tokens.generated.css is generated from design/tokens.json. Where Swift
        # exists this is a real check; where it does not, it says so out loud
        # rather than passing silently.
        run: |
          if command -v swift >/dev/null 2>&1; then
            swift scripts/generate-site-tokens.swift --check
          else
            echo "::notice::Swift unavailable on this runner - token drift is checked locally."
          fi

      - name: Build
        working-directory: site
        run: hugo --minify --gc --cleanDestinationDir

      - name: Assert the build produced a site
        # `hugo` can exit 0 having emitted almost nothing. Without this, an empty
        # public/ would be copied over a working release.
        run: |
          test -s site/public/index.html    || { echo "::error::no EN index.html"; exit 1; }
          test -s site/public/ru/index.html || { echo "::error::no RU index.html"; exit 1; }
          count=$(find site/public -type f | wc -l)
          echo "built $count files"
          [ "$count" -ge 20 ] || { echo "::error::only $count files built - refusing to deploy a stub"; exit 1; }

      - name: Run the site gate
        # hreflang + x-default on every page, canonical self-reference, JSON-LD
        # parses, sitemaps well-formed, OG images at 1200px, asset weight cap,
        # no em-dash, no <img> outside the screenshot partial.
        run: bash scripts/check-site.sh

      - name: Publish the release and flip the symlink
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_DIR="${DEPLOY_ROOT}/releases/${SHORT_SHA}"

          mkdir -p "${DEPLOY_ROOT}/releases"
          rm -rf "$RELEASE_DIR"
          cp -r site/public "$RELEASE_DIR"

          # `ln -sfn` over an existing symlink is not atomic: it unlinks, then
          # links, and a request landing in that window gets a 404. Creating a
          # temporary link and `mv -T`-ing it over the old one is a single
          # rename(2), so a reader sees either the old release or the new one.
          ln -sfn "$RELEASE_DIR" "${DEPLOY_ROOT}/.latest.tmp"
          mv -T "${DEPLOY_ROOT}/.latest.tmp" "${DEPLOY_ROOT}/latest"

          echo "Deployed ${SHORT_SHA} -> ${DEPLOY_ROOT}/latest"

      - name: Cleanup old releases (keep the last 5)
        run: |
          set -euo pipefail
          cd "${DEPLOY_ROOT}/releases"
          # Releases live in their own directory, so this no longer has to filter
          # the `latest` symlink out of the listing - a filter that would have
          # deleted the live release the day someone renamed the link.
          CURRENT="$(basename "$(readlink -f "${DEPLOY_ROOT}/latest")")"
          ls -dt */ 2>/dev/null | sed 's#/$##' \
            | grep -v "^${CURRENT}$" | tail -n +6 | xargs -r rm -rf
          echo "kept: $(ls -dt */ 2>/dev/null | tr -d '/' | tr '\n' ' ')"
