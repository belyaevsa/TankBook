name: iOS Core

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test TankbookCore + app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SwiftLint is the enforcement point for CLAUDE.md hard rule 5 (no ad-hoc hex
      # in UI code), so it must actually run - a silently skipped lint is a lint
      # that never gates anything. Runs from the repo root because .swiftlint.yml
      # and its `excluded:` paths are root-relative.
      - name: Install SwiftLint
        run: brew install swiftlint

      # XcodeGen generates Tankbook.xcodeproj from project.yml (P1.1); the
      # project is gitignored and must be reproducible from a clean checkout.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint
        run: swiftlint lint

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: swift build

      - name: Test
        working-directory: ios
        run: swift test

      # P0.3 pseudo-localization gate (docs/TASKS.md P0.3, docs/TESTING.md ->
      # CI gates). Fails the build - not warns - on any user-facing string the
      # String Catalog cannot resolve in Russian (CLAUDE.md hard rule 10).
      # Backed by LocalizationGateTests, which prove it fails on a deliberately
      # hardcoded string and that it ignores accessibility identifiers, launch
      # arguments, log messages and test code. Runs from the repo root; the
      # tool builds on the macOS runner via the ios/ SwiftPM package.
      - name: Localization gate
        run: >
          swift run --package-path ios localization-gate
          --sources ios/App/Sources
          --catalogue ios/App/Sources/Localizable.xcstrings

      # P2.2 L5 accuracy ratchet (docs/TESTING.md -> L5): OCRs the fixture
      # corpus with Vision and fails the build when any class (receipts, pump,
      # fiscal, screenshots) scores below its recorded high-water mark in
      # Spike/ReceiptSpike/fixtures/high-water.json. Runs as a focused re-run of
      # the ratchet tests so a regression is attributed to this gate, and the
      # failure names the per-class before/after.
      - name: OCR accuracy ratchet (L5)
        working-directory: ios
        run: swift test --filter corpusScoresDoNotRegress

      # The app target builds against the simulator (no signing, no device).
      - name: Build app
        run: >
          xcodebuild -project Tankbook.xcodeproj -scheme Tankbook
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
