# Tankbook SwiftLint configuration (P0.1 baseline).
# CLAUDE.md hard rule 5: all colours come from generated design tokens (P0.2),
# never ad-hoc hex in UI code. The custom rules at the bottom are the guard.
# Build path and SPM dependency sources are excluded so lint covers only our code.

excluded:
  # Every SwiftPM build directory, at any depth. Listing them one by one meant
  # Spike/ReceiptSpike/.build was linted, and SwiftPM's GENERATED test runner
  # tripped line-length and trailing-whitespace as errors - failing CI over code
  # nobody wrote and nobody can fix.
  - "**/.build"
  # P0.2: the generated token file is the single sanctioned source of hex values
  # (the no_literal_hex_colors rule guards hand-written UI code, not the token source).
  - ios/Sources/TankbookCore/Design/Theme.generated.swift
  # Other sessions' git worktrees live here. Their checkouts are not this
  # checkout's source - linting them reported ~22 errors from a copy of the
  # generated token file above, which the root-relative path on the line above
  # cannot match at that depth. Nobody can fix those from here.
  - ".claude"

opt_in_rules:
  - empty_count
  - first_where

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 2
  max_length:
    warning: 50
    error: 60

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 700

force_cast: warning
force_try: warning
trailing_whitespace: error

custom_rules:
  no_literal_hex_colors:
    name: 'No Literal Hex Colors'
    regex: '#[0-9A-Fa-f]{6}'
    match_kinds: string
    message: 'Ad-hoc hex colours are forbidden (CLAUDE.md hard rule 5). Use generated design tokens (P0.2).'
    severity: error
  no_color_component_init:
    name: 'No Color(red:) / UIColor(red:) Component Initializers'
    regex: '(?:Color|UIColor)(?:\.init)?\(red:'
    message: 'Raw component colour construction is forbidden (CLAUDE.md hard rule 5). Use generated design tokens (P0.2).'
    severity: error
  no_raw_os_logger:
    name: 'No Raw OSLogger'
    regex: 'Logger\(subsystem:'
    match_kinds:
      - identifier
    excluded: 'TankbookCore/Logging/'
    message: 'Constructing an os.Logger outside Logging/ is forbidden (docs/LOGGING.md §4-§5, hard rule 12). Log through the TankbookLog facade (AppLog), so the diagnostics export sees every line.'
    severity: error
