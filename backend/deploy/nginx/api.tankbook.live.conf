# api.tankbook.live -> the Tankbook API container on 127.0.0.1:17080
#
#   sudo cp backend/deploy/nginx/api.tankbook.live.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.tankbook.live.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.tankbook.live      # adds TLS to this file
#
# nginx is external to the deploy and is never edited by it. It proxies to ONE
# fixed port; blue-green swaps which container holds that port
# (backend/scripts/deploy-blue-green.sh). Nothing here changes between releases -
# that is the point.
#
# THIS FILE IS HTTP-ONLY ON PURPOSE, AND `certbot --nginx` COMPLETES IT.
# The obvious version - a 443 server with the ssl_certificate lines commented out
# until certbot runs - does not survive `nginx -t`: nginx refuses `listen ... ssl`
# with no certificate defined, so enabling it would break nginx BEFORE certbot
# could ever obtain one. Verified rather than reasoned about: that shape failed
# `nginx -t` with "no ssl_certificate is defined for the listen ... ssl
# directive". certbot edits this server block in place - adding `listen 443 ssl`,
# the certificate paths and an HTTP->HTTPS redirect server - so every directive
# below carries over to the TLS block automatically.

upstream tankbook_api {
    # 17080, not 8080. This host runs other containers and 8080 is the first
    # port anything else takes; proxying to a port somebody else's service might
    # win would be worse than failing. It must match TANKBOOK_SERVE_PORT in
    # backend/scripts/deploy-blue-green.sh - the deploy refuses to start if the
    # port is held by a container that is not ours, but nothing checks that this
    # file agrees, so change the two together.
    server 127.0.0.1:17080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tankbook.live;

    # ACME. Kept explicit so that when certbot adds its redirect server, the
    # challenge path still resolves - a redirected HTTP-01 challenge fails
    # renewal silently, and the certificate then expires 90 days later.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # THE BODY CAP IS LOAD BEARING, NOT BOILERPLATE.
    # A maximal legal sync push is 200 changes x 256 KB + envelope = 51.2 MB
    # (BodySizeLimits.PushBytes, computed from the same constants the validator
    # enforces). nginx's default client_max_body_size is 1 MB, so with the
    # default a legitimate push is refused by nginx with a bare HTML 413: the app
    # never sees it, and the client never receives the problem+json carrying its
    # traceId that docs/API.md promises. 52m leaves headroom over the computed
    # cap; the API still enforces the real per-endpoint limits itself.
    client_max_body_size 52m;
    client_body_timeout 120s;

    # /extract runs an image through a cloud model. Measured: median 6.5-8.3s,
    # peaks to 40s (docs/API.md, P4.12). nginx's 60s default would cut the
    # slowest legitimate requests. This is NOT the 3s device budget - that is the
    # client moving its UI on, not a limit on the request.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 5s;

    # Security headers.
    #
    # nginx's add_header does NOT inherit into a child block that sets any
    # add_header of ITS OWN - the whole parent set is then silently dropped. That
    # exact mistake shipped on tankbook.live: six locations set Cache-Control, so
    # the live site served no HSTS and no CSP at all while the config plainly
    # contained them, and it was found only by curling the running site
    # (HANDOVER.md).
    #
    # MEASURED HERE, because the rule is easy to over-apply: with the repeated
    # headers removed from /health, all three were STILL served - a block that
    # sets no add_header at all inherits normally. So the repetition below is
    # defensive, not currently load bearing: it is there for the day someone adds
    # a Cache-Control or a CORS header to that block, which is the moment the
    # parent set would vanish without a word. Keeping it and saying so beats
    # writing down a mechanism that does not apply.
    #
    # Verify with `curl -sI https://api.tankbook.live/health`, never by reading
    # this file - reading it is exactly what did not catch it on the site.
    #
    # HSTS is written here but only means anything once certbot has added TLS;
    # `always` keeps it on error responses too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # No CSP: this host serves JSON to a native app. A CSP would be a statement
    # about a document nobody renders.

    location / {
        proxy_pass http://tankbook_api;
        proxy_http_version 1.1;

        # Authorization passes through by default; these do not. Without
        # X-Forwarded-For the API logs the proxy as every client, and the per-IP
        # rate limits (docs/API.md) then key on one address and throttle every
        # user together.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering on;
        # A 51.2 MB push must not be spooled to disk before it is forwarded -
        # that doubles the latency of the largest requests for no benefit.
        proxy_request_buffering off;
    }

    # Health: polled by the deploy and by any uptime check, so it is kept out of
    # the access log rather than drowning the real traffic.
    location = /health {
        proxy_pass http://tankbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;

        # Defensive repetition - see the note above. Removing these three today
        # changes nothing; adding a fourth header of any kind here without them
        # would silently drop the server-level set.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
