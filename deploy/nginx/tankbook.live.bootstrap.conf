# Tankbook - nginx BOOTSTRAP configuration (step 1 of 2)
#
# Purpose: exist only long enough to get certificates. The full config
# (tankbook.live.conf) references certificate files, and `nginx -t` fails hard
# when they are absent:
#
#   cannot load certificate "/etc/letsencrypt/live/tankbook.live/fullchain.pem"
#
# That is a chicken and egg, not a mistake: certbot's webroot challenge needs
# nginx already answering on port 80, and the full config will not load until
# certbot has run. This file breaks the cycle - HTTP only, no TLS, no redirect,
# so the ACME challenge is reachable.
#
# Use it like this:
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/tankbook.live.bootstrap.conf /etc/nginx/sites-available/tankbook.live
#   sudo ln -sf /etc/nginx/sites-available/tankbook.live /etc/nginx/sites-enabled/tankbook.live
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # DNS for all three names must resolve to THIS host before the next line;
#   # certbot validates by fetching over HTTP, so an unresolved name fails here.
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d tankbook.live -d www.tankbook.live -d api.tankbook.live
#
#   # then swap in the real config:
#   sudo cp deploy/nginx/tankbook.live.conf /etc/nginx/sites-available/tankbook.live
#   sudo nginx -t && sudo systemctl reload nginx
#
# Serving the site over plain HTTP in the meantime is deliberate: it lets you
# confirm the deploy path and the root are right before TLS is in the picture.

server {
    listen 80;
    listen [::]:80;
    server_name tankbook.live www.tankbook.live api.tankbook.live;

    # Must come first and must NOT be redirected, or the challenge 301s away and
    # certbot fails validation.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # The same root the full config uses, so a successful page here proves the
    # deploy symlink and permissions are correct before TLS is added.
    root /opt/tankbook.live/latest;
    index index.html;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location ^~ /ru/ {
        error_page 404 /ru/404.html;
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}
