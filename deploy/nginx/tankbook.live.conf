# Tankbook - nginx site configuration
#
# Serves the static landing site at the apex and reverse-proxies the API
# subdomain. Companion to .github/workflows/deploy-landing.yml, which publishes
# releases into /opt/tankbook/releases/<sha> and flips /opt/tankbook/latest.
#
# Install:
#   sudo cp deploy/nginx/tankbook.live.conf /etc/nginx/sites-available/tankbook.live
#   sudo ln -s /etc/nginx/sites-available/tankbook.live /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# THIS IS STEP 2. Certificates must already exist, or `nginx -t` fails with
# "cannot load certificate .../fullchain.pem" - which is not a misconfiguration,
# it is the chicken and egg: certbot's webroot challenge needs nginx serving
# port 80, and this file will not load until certbot has run.
#
# Use deploy/nginx/tankbook.live.bootstrap.conf FIRST. It is HTTP-only, serves
# the ACME challenge, and carries the exact command sequence in its header.
# Come back here once /etc/letsencrypt/live/tankbook.live/ exists.
#
# RENEWAL IS AUTOMATIC as of 2026-08-28 (W11). The certificate was originally
# issued with `certbot --manual` and would never have renewed; it was re-issued
# over `--webroot` with `--cert-name tankbook.live` and
# `--deploy-hook "systemctl reload nginx"`, so certbot's timer renews it and
# nginx reloads to pick it up.
#
# Do not remove the ACME location from the port-80 block below. `^~` makes it
# win over the HTTPS redirect, and that is the only reason unattended renewal
# keeps working - a redirect there breaks renewal silently, months before the
# certificate actually expires.
#
# Procedure, both challenge methods, and the verification that proves any of it:
# deploy/nginx/RENEWAL.md. The check is `sudo certbot renew --dry-run`.
#
# nginx version: the TLS blocks use `listen 443 ssl http2`, which works on every
# version. `http2 on;` is 1.25.1+ only and is an unknown-directive ERROR on
# older builds - that is not a style preference, it is a startup failure.

# --- apex + www over plain HTTP: ACME first, then redirect ------------------
server {
    listen 80;
    listen [::]:80;
    server_name tankbook.live api.tankbook.live;

    # The ACME challenge must stay reachable over HTTP or renewals fail once the
    # redirect below is in place. This location comes first deliberately.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www is deliberately NOT served. There is no www DNS record (product owner,
# 2026-08-28) and the certificate carries no www SAN, so a www server block
# would be unreachable config - and worse, adding www back to the certificate
# would break unattended renewal, because HTTP validation is attempted for
# every name on the cert and a name that does not resolve fails the whole run.

# --- the landing site -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tankbook.live;

    ssl_certificate     /etc/letsencrypt/live/tankbook.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tankbook.live/privkey.pem;
    # TLS settings are inlined rather than `include
    # /etc/letsencrypt/options-ssl-nginx.conf`. That file only exists if certbot
    # was run with its nginx plugin; with `certonly --webroot` it is absent, and
    # a missing include is a hard `nginx -t` failure. Same for ssl-dhparams.pem,
    # which is unnecessary anyway once DHE ciphers are not in the list.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TankbookTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # `latest` is a symlink the deploy flips with a single rename(2). nginx
    # resolves it per request, so a release swap is picked up with no reload.
    # open_file_cache is deliberately NOT enabled: it would keep serving
    # descriptors from the previous release after the flip.
    root /opt/tankbook/latest;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Hugo emits pretty URLs: /privacy/ is /privacy/index.html on disk.
    location / {
        try_files $uri $uri/ =404;
    }

    # --- language-correct 404s ---------------------------------------------
    # Hugo builds /404.html and /ru/404.html. Without the nested rule a Russian
    # visitor hitting a dead /ru/ URL gets the English page - the same "breaks on
    # the half people skip" failure the RU <title> had.
    error_page 404 /404.html;
    location ^~ /ru/ {
        error_page 404 /ru/404.html;
        try_files $uri $uri/ =404;
    }

    # --- caching ------------------------------------------------------------
    # Fingerprinted by Hugo (…_hu_<hash>.webp): the name changes when the bytes
    # do, so these are safe to pin forever.
    location ~* _hu_[0-9a-f]+\.(webp|png|jpe?g|svg|css|js)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repeated deliberately. nginx's add_header does NOT inherit into a
        # block that sets any add_header of its own, so a location adding
        # Cache-Control silently drops every security header from the server
        # level. That is not theoretical - it shipped: the live site served no
        # HSTS and no CSP on any page or asset until this was found by curling
        # the running site. Duplication with a reason beats a snippet file an
        # operator can forget to install.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # NOT fingerprinted - screenshots keep their task-id names across re-shoots,
    # so a long immutable cache would pin a stale image. A day, revalidated.
    location ^~ /screenshots/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        # Repeated deliberately. nginx's add_header does NOT inherit into a
        # block that sets any add_header of its own, so a location adding
        # Cache-Control silently drops every security header from the server
        # level. That is not theoretical - it shipped: the live site served no
        # HSTS and no CSP on any page or asset until this was found by curling
        # the running site. Duplication with a reason beats a snippet file an
        # operator can forget to install.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /og/ {
        add_header Cache-Control "public, max-age=86400" always;
        # Repeated deliberately. nginx's add_header does NOT inherit into a
        # block that sets any add_header of its own, so a location adding
        # Cache-Control silently drops every security header from the server
        # level. That is not theoretical - it shipped: the live site served no
        # HSTS and no CSP on any page or asset until this was found by curling
        # the running site. Duplication with a reason beats a snippet file an
        # operator can forget to install.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # HTML carries the inlined CSS, so a stale page is a stale stylesheet too.
    # Always revalidate; the responses are small and gzip well.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # Repeated deliberately. nginx's add_header does NOT inherit into a
        # block that sets any add_header of its own, so a location adding
        # Cache-Control silently drops every security header from the server
        # level. That is not theoretical - it shipped: the live site served no
        # HSTS and no CSP on any page or asset until this was found by curling
        # the running site. Duplication with a reason beats a snippet file an
        # operator can forget to install.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Same add_header inheritance caveat as above.
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated deliberately. nginx's add_header does NOT inherit into a
        # block that sets any add_header of its own, so a location adding
        # Cache-Control silently drops every security header from the server
        # level. That is not theoretical - it shipped: the live site served no
        # HSTS and no CSP on any page or asset until this was found by curling
        # the running site. Duplication with a reason beats a snippet file an
        # operator can forget to install.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated deliberately. nginx's add_header does NOT inherit into a
        # block that sets any add_header of its own, so a location adding
        # Cache-Control silently drops every security header from the server
        # level. That is not theoretical - it shipped: the live site served no
        # HSTS and no CSP on any page or asset until this was found by curling
        # the running site. Duplication with a reason beats a snippet file an
        # operator can forget to install.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- compression --------------------------------------------------------
    # Only for text. PNG and WebP are already compressed; gzipping them burns
    # CPU to add bytes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/xml+rss
               application/json application/ld+json image/svg+xml;

    # --- security headers ---------------------------------------------------
    # The built site loads ZERO external resources and runs no executable
    # JavaScript - the only <script> is one application/ld+json data block - so
    # a strict policy is actually deployable here rather than aspirational.
    #
    # 'unsafe-inline' appears for style-src ONLY because all CSS is inlined in a
    # single <style> by design (one request, no render-blocking fetch). A nonce
    # would be stricter but needs per-request generation, which static files
    # cannot do. It is a real trade, recorded rather than hidden.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Dotfiles are never content here.
    location ~ /\. { deny all; }
}

# --- the API ----------------------------------------------------------------
# api.tankbook.live is what Config.default.json ships as apiBaseUrl and what
# HostAllowlist.allowedDomain permits. It must answer for the app to sync; the
# app degrades to local-only if it does not, so a broken proxy here is a quiet
# failure rather than a loud one.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.tankbook.live;

    ssl_certificate     /etc/letsencrypt/live/tankbook.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tankbook.live/privkey.pem;
    # TLS settings are inlined rather than `include
    # /etc/letsencrypt/options-ssl-nginx.conf`. That file only exists if certbot
    # was run with its nginx plugin; with `certonly --webroot` it is absent, and
    # a missing include is a hard `nginx -t` failure. Same for ssl-dhparams.pem,
    # which is unnecessary anyway once DHE ciphers are not in the list.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TankbookTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Blob uploads go to S3-compatible storage via presigned URLs, so request
    # bodies here stay small - but /import/parse takes a CSV upload and the
    # gateway takes a JPEG rendition inside a 4 MB envelope. 8m leaves headroom
    # without inviting anything larger.
    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # ADJUST: the port Kestrel actually listens on.
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # The device's /extract budget is a UI deadline, not a request abort:
        # the client moves on at 3 s while the request keeps running, and the
        # corpus measured the gateway at a 40 s maximum. A 60 s read timeout
        # keeps nginx from killing work the client still intends to collect.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # /health is the config guardrail's probe: a candidate apiBaseUrl is only
    # promoted after this answers. Keep it cheap and unlogged.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }
}
