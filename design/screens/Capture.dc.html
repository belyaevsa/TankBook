<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #4FC3E8; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #07090C; color: #EAEDF2; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, #23201B 0%, #12100D 55%, #07090C 100%);"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 60px 20px 0;">
    <div style="width: 34px; height: 34px; border-radius: 50%; background: rgba(16,19,24,0.7); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="#EAEDF2" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div style="font-size: 12px; font-weight: 600; color: #98A2B3; background: rgba(16,19,24,0.7); border-radius: 999px; padding: 6px 13px;">Volvo V60</div>
    <div style="width: 34px; height: 34px; border-radius: 50%; background: rgba(16,19,24,0.7); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.8a2.5 2.5 0 0 1 2.4 1.8l.3 1a5.6 5.6 0 0 1 1.4.8l1-.3a2.5 2.5 0 0 1 0 4.8" stroke="#EAEDF2" stroke-width="0"/><path d="M5.5 8a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0zM8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" stroke="#EAEDF2" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center;">
    <div style="width: 250px; height: 330px; position: relative;">
      <div style="position: absolute; left: -2px; top: -2px; width: 34px; height: 34px; border-left: 2.5px solid #F4503A; border-top: 2.5px solid #F4503A; border-radius: 8px 0 0 0;"></div>
      <div style="position: absolute; right: -2px; top: -2px; width: 34px; height: 34px; border-right: 2.5px solid #F4503A; border-top: 2.5px solid #F4503A; border-radius: 0 8px 0 0;"></div>
      <div style="position: absolute; left: -2px; bottom: -2px; width: 34px; height: 34px; border-left: 2.5px solid #F4503A; border-bottom: 2.5px solid #F4503A; border-radius: 0 0 0 8px;"></div>
      <div style="position: absolute; right: -2px; bottom: -2px; width: 34px; height: 34px; border-right: 2.5px solid #F4503A; border-bottom: 2.5px solid #F4503A; border-radius: 0 0 8px 0;"></div>
      <div style="position: absolute; inset: 26px 34px; background: #DCD8CA; opacity: 0.85; border-radius: 3px; transform: rotate(-2deg); box-shadow: 0 12px 34px rgba(0,0,0,0.55); padding: 12px; font-family: 'IBM Plex Mono', monospace; color: #55503F;">
        <div style="text-align: center; font-size: 10px;">SHELL 1234</div>
        <div style="border-top: 1px dashed #A8A28C; margin: 8px 0;"></div>
        <div style="font-size: 8px; line-height: 2.1;">DIESEL B7</div>
        <div style="font-size: 8px; line-height: 2.1;">42.30 L    1.679/L</div>
        <div style="font-size: 9px; line-height: 2.1;">TOTAL     71.02 EUR</div>
      </div>
    </div>
    <div style="position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; color: #98A2B3;">Receipts, pump displays and fiscal QR are detected automatically</div>
  </div>

  <div style="position: relative; padding: 0 0 40px; background: linear-gradient(180deg, rgba(7,9,12,0) 0%, rgba(7,9,12,0.92) 30%);">
    <div style="display: flex; justify-content: center; gap: 7px; padding: 10px 16px 0; flex-wrap: wrap;">
      <span style="padding: 8px 15px; border-radius: 999px; background: rgba(244,80,58,0.16); border: 1.5px solid #F4503A; font-size: 12px; font-weight: 700;">Fill-up · auto</span>
      <span style="padding: 8px 15px; border-radius: 999px; background: rgba(16,19,24,0.8); border: 1px solid #2A3140; font-size: 12px; font-weight: 600; color: #98A2B3;">Charge</span>
      <span style="padding: 8px 15px; border-radius: 999px; background: rgba(16,19,24,0.8); border: 1px solid #2A3140; font-size: 12px; font-weight: 600; color: #98A2B3;">Service</span>
      <span style="padding: 8px 15px; border-radius: 999px; background: rgba(16,19,24,0.8); border: 1px solid #2A3140; font-size: 12px; font-weight: 600; color: #98A2B3;">Expense</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 44px 0;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <div style="width: 42px; height: 42px; border-radius: 11px; background: rgba(16,19,24,0.8); border: 1px solid #2A3140; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="3" stroke="#98A2B3" stroke-width="1.5"/><path d="M3 13l4-4 4 4 3-3 3 3" stroke="#98A2B3" stroke-width="1.5" stroke-linejoin="round"/><circle cx="13.2" cy="6.8" r="1.4" fill="#98A2B3"/></svg>
        </div>
        <span style="font-size: 10px; color: #98A2B3;">Photos</span>
      </div>
      <div style="width: 76px; height: 76px; border-radius: 50%; border: 4px solid #FFF2EE; background: #F4503A; box-shadow: 0 6px 26px rgba(244,80,58,0.45); display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="9.5" stroke="#FFF2EE" stroke-width="2.2"/><circle cx="15" cy="15" r="3.4" fill="#FFF2EE"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <div style="width: 42px; height: 42px; border-radius: 11px; background: rgba(16,19,24,0.8); border: 1px solid #2A3140; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M4 7V5.5A1.5 1.5 0 0 1 5.5 4H7M13 4h1.5A1.5 1.5 0 0 1 16 5.5V7M16 13v1.5a1.5 1.5 0 0 1-1.5 1.5H13M7 16H5.5A1.5 1.5 0 0 1 4 14.5V13M7 10h6" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <span style="font-size: 10px; color: #98A2B3;">Type it</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
