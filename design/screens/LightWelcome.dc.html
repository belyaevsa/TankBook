<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #0E7FA6; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F6F8; color: #1A2028; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="position: absolute; top: -120px; left: 50%; transform: translateX(-50%); width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(214,58,38,0.09) 0%, rgba(214,58,38,0) 68%);"></div>

  <div style="flex: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 32px;">
    <div style="width: 92px; height: 92px; border-radius: 26px; background: #FFFFFF; border: 1px solid #D8DCE3; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(26,32,40,0.12);">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <path d="M14 42V14a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v28" stroke="#D63A26" stroke-width="3" stroke-linecap="round"/>
        <path d="M10 42h26" stroke="#D63A26" stroke-width="3" stroke-linecap="round"/>
        <path d="M18 16h10v8H18z" stroke="#D63A26" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M32 20h4a3 3 0 0 1 3 3v10a2.5 2.5 0 0 0 5 0v-9" stroke="#D63A26" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M41 17l3 3 6-7" stroke="#0E7FA6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div style="text-align: center;">
      <div style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 42px; letter-spacing: -0.01em;">Tankbook</div>
      <div style="font-size: 16px; color: #55606E; margin-top: 6px; letter-spacing: 0.02em;">Scan the receipt – or type the numbers</div>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 44px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="11" rx="2.5" stroke="#55606E" stroke-width="1.5"/><circle cx="10" cy="10.5" r="3" stroke="#55606E" stroke-width="1.5"/><path d="M7.5 5l1-1.8h3l1 1.8" stroke="#55606E" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span style="font-size: 14px; color: #1A2028;">Scan receipts and pump displays</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 17V7a3 3 0 0 1 3-3h2a3 3 0 0 1 3 3v10M4 17h12" stroke="#55606E" stroke-width="1.5" stroke-linecap="round"/><path d="M12 9.5l2.6-3.8M8 9.5l-1.3 4" stroke="#55606E" stroke-width="0" /><path d="M9 12l1.5-4 1.5 4" stroke="#55606E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 14px; color: #1A2028;">Fuel, charging and service in one history</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2.8l6 2.2v4.4c0 4-2.5 6.7-6 7.8-3.5-1.1-6-3.8-6-7.8V5l6-2.2z" stroke="#55606E" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.4 10l1.8 1.8 3.2-3.6" stroke="#55606E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 14px; color: #1A2028;">No account needed – your data stays yours</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 26px 40px;">
    <div style="background: #D63A26; border-radius: 15px; padding: 17px; text-align: center; font-size: 16px; font-weight: 700; color: #FFF2EE; box-shadow: 0 4px 20px rgba(214,58,38,0.3);">Add your car</div>
    <div style="border: 1px solid #D8DCE3; border-radius: 15px; padding: 16px; text-align: center; font-size: 15px; font-weight: 600; color: #1A2028; background: #F0F2F5;">Import from another app</div>
    <div style="text-align: center; padding-top: 4px; font-size: 13px; color: #55606E;">Already use Tankbook? <span style="font-weight: 700; color: #0E7FA6;">Sign in</span> – your garage follows you.</div>
  </div>
</div>
</x-dc>
</body>
</html>
