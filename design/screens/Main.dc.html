<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #4FC3E8; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #101318; color: #EAEDF2; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 64px 20px 12px;">
    <div style="font-family: 'Archivo', sans-serif; font-stretch: 82%; font-weight: 800; font-size: 20px;">Tankbook</div>
    <svg width="21" height="21" viewBox="0 0 21 21" fill="none"><circle cx="10.5" cy="10.5" r="2.6" stroke="#98A2B3" stroke-width="1.5"/><path d="M10.5 2.2v2.1M10.5 16.7v2.1M2.2 10.5h2.1M16.7 10.5h2.1M4.6 4.6l1.5 1.5M14.9 14.9l1.5 1.5M16.4 4.6l-1.5 1.5M6.1 14.9l-1.5 1.5" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round"/></svg>
  </div>

  <div style="margin: 4px 20px 0; border-radius: 18px; overflow: hidden; background: linear-gradient(160deg, #1E2632 0%, #151A22 70%); border: 1px solid #232A36;">
    <div style="display: flex; align-items: center; justify-content: center; height: 150px; position: relative;">
      <svg width="230" height="86" viewBox="0 0 230 86" fill="none">
        <path d="M18 62c8-20 26-32 52-36l18-14c8-6 20-9 34-9 22 0 38 7 48 16l22 6c14 4 22 12 22 22v10a5 5 0 0 1-5 5h-14" stroke="#4A5568" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M18 62h-4a4 4 0 0 1-4-4v-6c0-4 3-8 8-8" stroke="#4A5568" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M84 24l-12 12h58l-8-14c-10-2-26-2-38 2z" stroke="#4A5568" stroke-width="2"/>
        <circle cx="62" cy="64" r="15" stroke="#98A2B3" stroke-width="2.6"/>
        <circle cx="176" cy="64" r="15" stroke="#98A2B3" stroke-width="2.6"/>
        <path d="M78 64h82" stroke="#4A5568" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div style="position: absolute; top: 12px; right: 14px; background: rgba(16,19,24,0.7); border: 1px solid #2A3140; border-radius: 999px; padding: 4px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: #98A2B3;">DIESEL</div>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 18px 14px;">
      <div>
        <div style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 800; font-size: 22px;">Volvo V60</div>
        <div style="font-size: 12px; color: #98A2B3; margin-top: 1px; font-variant-numeric: tabular-nums;">119 486 km · updated Aug 17</div>
      </div>
    </div>
    <div style="display: flex; border-top: 1px solid #232A36;">
      <div style="flex: 1; padding: 12px 8px; text-align: center;">
        <div style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums;">6.8</div>
        <div style="font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: #98A2B3; margin-top: 2px;">L/100km</div>
      </div>
      <div style="width: 1px; background: #232A36;"></div>
      <div style="flex: 1; padding: 12px 8px; text-align: center;">
        <div style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums;">0.19&thinsp;€</div>
        <div style="font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: #98A2B3; margin-top: 2px;">per km</div>
      </div>
      <div style="width: 1px; background: #232A36;"></div>
      <div style="flex: 1; padding: 12px 8px; text-align: center;">
        <div style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums;">€212</div>
        <div style="font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: #98A2B3; margin-top: 2px;">August</div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin: 12px 20px 0; background: rgba(240,160,48,0.08); border: 1px solid rgba(240,160,48,0.35); border-radius: 13px; padding: 11px 14px;">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 6.5v3.5M9 12.6v.2M2.7 14.5h12.6a1 1 0 0 0 .87-1.5L9.87 3.5a1 1 0 0 0-1.74 0L1.83 13a1 1 0 0 0 .87 1.5z" stroke="#F0A030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="flex: 1; font-size: 12px; color: #EAEDF2;">Insurance renews in 12 days</div>
    <span style="font-size: 11px; font-weight: 700; color: #F0A030;">View</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 14px 20px 0; min-height: 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #98A2B3;">Recent</span>
      <span style="font-size: 11px; font-weight: 600; color: #4FC3E8;">All entries</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #1A1F27; border: 1px solid #232A36; border-radius: 13px; padding: 12px 14px;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #F4503A; flex: none;"></span>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600;">Shell</div>
        <div style="font-size: 12px; color: #98A2B3; margin-top: 1px;">42.3 L · Diesel · Aug 17</div>
      </div>
      <div style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;">71.02&thinsp;€</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #1A1F27; border: 1px solid #232A36; border-radius: 13px; padding: 12px 14px;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #4FC3E8; flex: none;"></span>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600;">Ionity</div>
        <div style="font-size: 12px; color: #98A2B3; margin-top: 1px;">38 kWh · DC · Aug 14</div>
      </div>
      <div style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;">21.50&thinsp;€</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-around; padding: 10px 12px 28px; border-top: 1px solid #1C222C; background: #0D1015;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 6h14M4 11h14M4 16h9" stroke="#EAEDF2" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #EAEDF2;">Log</span>
    </div>
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #F4503A; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(244,80,58,0.35); margin-top: -22px;">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="8.5" stroke="#FFF2EE" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#FFF2EE"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3.5 16l4.5-5 3.5 3 6.5-8" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Trends</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 13l1.5-4.5A2 2 0 0 1 7.4 7h7.2a2 2 0 0 1 1.9 1.5L18 13v4h-2.5v-1.5h-9V17H4v-4z" stroke="#98A2B3" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Garage</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
