<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #4FC3E8; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: linear-gradient(180deg, #14181F 0%, #0B0E13 100%); color: #EAEDF2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 1;"></div>

  <div style="padding: 0 12px;">

    <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6474; padding: 0 8px 10px;">Collapsed</div>

    <div style="background: rgba(38,44,54,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 11px;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #F4503A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="7.2" stroke="#FFF2EE" stroke-width="1.8"/><circle cx="11" cy="11" r="2.6" fill="#FFF2EE"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
          <span style="font-size: 13px; font-weight: 700;">Oil change · Volvo V60</span>
          <span style="font-size: 11px; color: #98A2B3;">now</span>
        </div>
        <div style="font-size: 13px; color: #C7CEDA; margin-top: 3px; line-height: 1.35;">Overdue by 320 km.</div>
      </div>
    </div>

    <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6474; padding: 22px 8px 10px;">Pressed and held</div>

    <div style="background: rgba(38,44,54,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; overflow: hidden;">
      <div style="padding: 14px 16px; display: flex; align-items: flex-start; gap: 11px;">
        <div style="width: 34px; height: 34px; border-radius: 9px; background: #F4503A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="7.2" stroke="#FFF2EE" stroke-width="1.8"/><circle cx="11" cy="11" r="2.6" fill="#FFF2EE"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
            <span style="font-size: 13px; font-weight: 700;">Oil change · Volvo V60</span>
            <span style="font-size: 11px; color: #98A2B3;">now</span>
          </div>
          <div style="font-size: 13px; color: #C7CEDA; margin-top: 3px; line-height: 1.35;">Overdue by 320 km. Due at 123 280 km or Aug 2026.</div>
        </div>
      </div>

      <div style="display: flex; border-top: 1px solid rgba(255,255,255,0.10);">
        <div style="flex: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 7px; border-right: 1px solid rgba(255,255,255,0.10);">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.8" stroke="#4FD18C" stroke-width="1.5"/><path d="M6 9.2l2.1 2.1L12 7.4" stroke="#4FD18C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 14px; font-weight: 600; color: #EAEDF2;">Mark done</span>
        </div>
        <div style="flex: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 7px;">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.5" stroke="#98A2B3" stroke-width="1.5"/><path d="M9 5.5V9l2.5 1.5" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span style="font-size: 14px; font-weight: 600; color: #EAEDF2;">Push a week</span>
        </div>
      </div>
    </div>

    <div style="font-size: 12px; color: #5A6474; text-align: center; padding: 16px 20px 0; line-height: 1.45;">Mark done opens the app on the completion sheet – logging the cost stays a choice, never skipped for the user.</div>

  </div>

  <div style="height: 96px;"></div>
</div>
</x-dc>
</body>
</html>
