<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #4FC3E8; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #101318; color: #EAEDF2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 64px 20px 8px;">
    <div style="font-family: 'Archivo', sans-serif; font-stretch: 82%; font-weight: 800; font-size: 20px; letter-spacing: 0.01em;">Log</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #1A1F27; border: 1px solid #232A36; display: flex; align-items: center; justify-content: center; position: relative;">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M9 2.5a4.5 4.5 0 0 1 4.5 4.5c0 3 1 4.2 1.6 4.9H2.9c.6-.7 1.6-1.9 1.6-4.9A4.5 4.5 0 0 1 9 2.5zM7.3 14.5a1.8 1.8 0 0 0 3.4 0" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #1A1F27; border: 1px solid #232A36; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.6" stroke="#98A2B3" stroke-width="1.5"/><path d="M9 2.2v2M9 13.8v2M2.2 9h2M13.8 9h2M4.2 4.2l1.4 1.4M12.4 12.4l1.4 1.4M13.8 4.2l-1.4 1.4M5.6 12.4l-1.4 1.4" stroke="#98A2B3" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

  <div style="padding: 6px 20px 0;">
    <div style="display: flex; align-items: center; gap: 6px; background: #1A1F27; border: 1px solid #232A36; border-radius: 999px; padding: 6px 12px; align-self: flex-start; width: fit-content;">
      <span style="font-size: 12px; font-weight: 600; color: #EAEDF2;">Volvo V60</span>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 4l3 3 3-3" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div style="padding: 18px 20px 4px;">
    <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #98A2B3;">Average consumption</div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 2px;">
      <span style="font-family: 'Archivo', sans-serif; font-stretch: 76%; font-weight: 800; font-size: 68px; line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;">5.3</span>
      <span style="font-size: 14px; color: #98A2B3;">L/100km</span>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 10px;">

    <div style="background: #1A1F27; border: 1px solid rgba(240,160,48,0.45); border-radius: 15px; padding: 14px 16px; display: flex; align-items: center; gap: 10px;">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 2.5a4.5 4.5 0 0 1 4.5 4.5c0 3 1 4.2 1.6 4.9H2.9c.6-.7 1.6-1.9 1.6-4.9A4.5 4.5 0 0 1 9 2.5zM7.3 14.5a1.8 1.8 0 0 0 3.4 0" stroke="#F0A030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="flex: 1; font-size: 12px; font-weight: 600; color: #F0A030;">Oil change overdue by 320 km</span>
      <span style="font-size: 12px; font-weight: 700; color: #8FB4D9;">View</span>
    </div>

    <div style="background: #1A1F27; border: 1px solid #232A36; border-radius: 15px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2.5a4.5 4.5 0 0 1 4.5 4.5c0 3 1 4.2 1.6 4.9H2.9c.6-.7 1.6-1.9 1.6-4.9A4.5 4.5 0 0 1 9 2.5zM7.3 14.5a1.8 1.8 0 0 0 3.4 0" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600;">Reminders</div>
        <div style="font-size: 12px; color: #98A2B3; margin-top: 1px;">Across all your cars</div>
      </div>
      <span style="font-size: 11px; font-weight: 700; color: #F0A030; background: rgba(240,160,48,0.12); border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums;">2 due</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2.5L9.5 7 5 11.5" stroke="#5A6474" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #98A2B3; margin-top: 6px;">September</div>

    <div style="background: #1A1F27; border: 1px solid #232A36; border-radius: 15px; padding: 13px 16px; display: flex; align-items: center; gap: 10px;">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M5.5 15V6.2c0-.6.5-1.2 1.2-1.2h3.1c.7 0 1.2.6 1.2 1.2V15M4 15h9M11 8.5h1.6c.5 0 .9.4.9.9v3c0 .6.4 1 1 1s1-.4 1-1V8.2l-2-2" stroke="#F4503A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600;">Neste</div>
        <div style="font-size: 11px; color: #98A2B3; margin-top: 1px; font-variant-numeric: tabular-nums;">42.0 L · 95 · 123 600 km · Sep 5</div>
      </div>
      <div style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;">68.46&thinsp;€</div>
    </div>

    <div style="background: #1A1F27; border: 1px solid #232A36; border-radius: 15px; padding: 13px 16px; display: flex; align-items: center; gap: 10px;">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M5.5 15V6.2c0-.6.5-1.2 1.2-1.2h3.1c.7 0 1.2.6 1.2 1.2V15M4 15h9M11 8.5h1.6c.5 0 .9.4.9.9v3c0 .6.4 1 1 1s1-.4 1-1V8.2l-2-2" stroke="#F4503A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600;">Shell</div>
        <div style="font-size: 11px; color: #98A2B3; margin-top: 1px; font-variant-numeric: tabular-nums;">43.5 L · 95 · 122 800 km · Sep 3</div>
      </div>
      <div style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;">71.02&thinsp;€</div>
    </div>
  </div>

  <div style="flex: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: space-around; padding: 10px 12px 28px; border-top: 1px solid #1C222C; background: #0D1015;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 6h14M4 11h14M4 16h9" stroke="#EAEDF2" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #EAEDF2;">Log</span>
    </div>
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #F4503A; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(244,80,58,0.35); margin-top: -22px;">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="8.5" stroke="#FFF2EE" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#FFF2EE"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3.5 16l4.5-5 3.5 3 6.5-8" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Trends</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 13l1.5-4.5A2 2 0 0 1 7.4 7h7.2a2 2 0 0 1 1.9 1.5L18 13v4h-2.5v-1.5h-9V17H4v-4z" stroke="#98A2B3" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Garage</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
