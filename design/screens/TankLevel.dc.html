<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #4FC3E8; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #101318; color: #EAEDF2; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="position: absolute; inset: 0; background: #101318;">
    <div style="height: 218px; background: #0B0D11; opacity: 0.4;"></div>
    <div style="margin: -24px 0 0; height: 400px; background: #1A1F27; border-radius: 24px 24px 0 0; opacity: 0.4;"></div>
    <div style="position: absolute; inset: 0; background: rgba(8,10,13,0.62);"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #1A1F27; border-radius: 24px 24px 0 0; border-top: 1px solid #2A3140; padding: 10px 24px 44px;">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A4354; margin: 4px auto 16px;"></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-family: 'Archivo', sans-serif; font-stretch: 82%; font-weight: 800; font-size: 18px;">Tank after fill-up</span>
      <span style="font-size: 12px; color: #98A2B3;">didn't fill to full?</span>
    </div>

    <div style="display: flex; gap: 7px; margin-top: 16px;">
      <div style="flex: 1.3; text-align: center; padding: 12px 4px; border-radius: 13px; background: #12161C; border: 1px solid #232A36; font-size: 13px; font-weight: 600; color: #98A2B3;">Full</div>
      <div style="flex: 1; text-align: center; padding: 12px 4px; border-radius: 13px; background: rgba(244,80,58,0.14); border: 1.5px solid #F4503A; font-size: 13px; font-weight: 700;">¾</div>
      <div style="flex: 1; text-align: center; padding: 12px 4px; border-radius: 13px; background: #12161C; border: 1px solid #232A36; font-size: 13px; font-weight: 600; color: #98A2B3;">½</div>
      <div style="flex: 1; text-align: center; padding: 12px 4px; border-radius: 13px; background: #12161C; border: 1px solid #232A36; font-size: 13px; font-weight: 600; color: #98A2B3;">¼</div>
    </div>

    <div style="margin-top: 18px; background: #12161C; border: 1px solid #2A3140; border-radius: 16px; padding: 16px 18px 14px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #98A2B3;">Fine-tune</span>
        <span style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-family: 'Archivo', sans-serif; font-stretch: 76%; font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums;">75</span>
          <span style="font-size: 13px; font-weight: 600; color: #98A2B3;">%</span>
        </span>
      </div>

      <div style="position: relative; margin-top: 14px; height: 34px;">
        <div style="position: absolute; left: 0; right: 0; top: 12px; height: 10px; border-radius: 5px; background: #232A36;"></div>
        <div style="position: absolute; left: 0; width: 75%; top: 12px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #B2382E 0%, #F4503A 100%);"></div>
        <div style="position: absolute; left: 75%; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: #EAEDF2; transform: translateX(-50%); box-shadow: 0 2px 8px rgba(0,0,0,0.5); border: 3px solid #F4503A;"></div>
        <div style="position: absolute; left: 0; top: -3px; font-size: 10px; font-weight: 700; color: #5A6474;">E</div>
        <div style="position: absolute; left: 25%; top: 26px; width: 1.5px; height: 6px; background: #3A4354;"></div>
        <div style="position: absolute; left: 50%; top: 26px; width: 1.5px; height: 8px; background: #3A4354;"></div>
        <div style="position: absolute; left: 75%; top: 26px; width: 1.5px; height: 6px; background: #3A4354;"></div>
        <div style="position: absolute; right: 0; top: -3px; font-size: 10px; font-weight: 700; color: #5A6474;">F</div>
      </div>

      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px;">
        <span style="font-size: 12px; color: #5A6474;">snaps to eighths</span>
        <span style="font-size: 13px; color: #98A2B3; font-variant-numeric: tabular-nums;">≈ 53 of 71 L</span>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; padding: 0 2px;">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="flex: none; margin-top: 2px;"><circle cx="7.5" cy="7.5" r="6" stroke="#98A2B3" stroke-width="1.4"/><path d="M7.5 6.8v3.4M7.5 4.6v.2" stroke="#98A2B3" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span style="font-size: 12px; color: #98A2B3; line-height: 1.5;">With a tank level, consumption stays exact even between partial fill-ups. Skip it and this counts as a partial – math resumes at your next full tank.</span>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 18px;">
      <div style="flex: 1; border: 1px solid #2A3140; border-radius: 15px; padding: 15px; text-align: center; font-size: 15px; font-weight: 600; color: #98A2B3; background: #12161C;">Skip</div>
      <div style="flex: 2; background: #F4503A; border-radius: 15px; padding: 15px; text-align: center; font-size: 15px; font-weight: 700; color: #FFF2EE;">Set ¾ tank</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
