<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #4FC3E8; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #101318; color: #EAEDF2; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 64px 20px 10px;">
    <div style="font-family: 'Archivo', sans-serif; font-stretch: 82%; font-weight: 800; font-size: 20px;">Trends</div>
    <div style="display: flex; align-items: center; gap: 6px; background: #1A1F27; border: 1px solid #232A36; border-radius: 999px; padding: 6px 12px;">
      <span style="font-size: 12px; font-weight: 600;">Year</span>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 4l3 3 3-3" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div style="padding: 10px 20px 4px;">
    <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #98A2B3;">Consumption</div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 2px;">
      <span style="font-family: 'Archivo', sans-serif; font-stretch: 76%; font-weight: 800; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums;">6.8</span>
      <span style="font-size: 14px; font-weight: 600; color: #98A2B3;">L/100KM</span>
      <span style="font-size: 12px; font-weight: 700; color: #F4503A; margin-left: auto;">▼ 0.4 vs 2025</span>
    </div>
  </div>

  <div style="margin: 10px 20px 0; background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 14px 14px 10px;">
    <svg width="318" height="120" viewBox="0 0 318 120" fill="none" style="display: block;">
      <path d="M0 30h318M0 60h318M0 90h318" stroke="#232A36" stroke-width="1"/>
      <path d="M8 78 L44 62 L80 70 L116 50 L152 58 L188 40 L224 48 L260 34 L296 28" stroke="#F4503A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 78 L44 62 L80 70 L116 50 L152 58 L188 40 L224 48 L260 34 L296 28 L296 118 L8 118 Z" fill="#F4503A" opacity="0.08"/>
      <circle cx="296" cy="28" r="4" fill="#F4503A"/>
      <text x="8" y="114" fill="#5A6474" font-size="9" font-family="system-ui">Dec</text>
      <text x="150" y="114" fill="#5A6474" font-size="9" font-family="system-ui">Apr</text>
      <text x="282" y="114" fill="#5A6474" font-size="9" font-family="system-ui">Aug</text>
    </svg>
  </div>

  <div style="padding: 18px 20px 4px; display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #98A2B3;">Price per liter</span>
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;">1.679&thinsp;€ <span style="font-size: 11px; font-weight: 600; color: #98A2B3;">▲ 3.1%</span></span>
  </div>
  <div style="margin: 6px 20px 0; background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 12px 14px 8px;">
    <svg width="318" height="72" viewBox="0 0 318 72" fill="none" style="display: block;">
      <path d="M0 24h318M0 48h318" stroke="#232A36" stroke-width="1"/>
      <path d="M8 46 L44 50 L80 42 L116 46 L152 36 L188 40 L224 30 L260 34 L296 24" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="296" cy="24" r="3.5" fill="#98A2B3"/>
    </svg>
  </div>

  <div style="padding: 18px 20px 4px; display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #98A2B3;">Monthly spend</span>
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;">€212 <span style="font-size: 11px; font-weight: 600; color: #98A2B3;">Aug</span></span>
  </div>
  <div style="margin: 6px 20px 0; background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 14px 14px 8px;">
    <svg width="318" height="88" viewBox="0 0 318 88" fill="none" style="display: block;">
      <rect x="12" y="34" width="20" height="42" rx="4" fill="#3A4354"/>
      <rect x="50" y="26" width="20" height="50" rx="4" fill="#3A4354"/>
      <rect x="88" y="42" width="20" height="34" rx="4" fill="#3A4354"/>
      <rect x="126" y="20" width="20" height="56" rx="4" fill="#3A4354"/>
      <rect x="164" y="30" width="20" height="46" rx="4" fill="#3A4354"/>
      <rect x="202" y="14" width="20" height="62" rx="4" fill="#3A4354"/>
      <rect x="240" y="24" width="20" height="52" rx="4" fill="#3A4354"/>
      <rect x="278" y="38" width="20" height="38" rx="4" fill="#F4503A"/>
      <text x="14" y="86" fill="#5A6474" font-size="9" font-family="system-ui">Jan</text>
      <text x="280" y="86" fill="#5A6474" font-size="9" font-family="system-ui">Aug</text>
    </svg>
  </div>

  <div style="flex: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: space-around; padding: 10px 12px 28px; border-top: 1px solid #1C222C; background: #0D1015;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 6h14M4 11h14M4 16h9" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Log</span>
    </div>
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #F4503A; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(244,80,58,0.35); margin-top: -22px;">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="8.5" stroke="#FFF2EE" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#FFF2EE"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3.5 16l4.5-5 3.5 3 6.5-8" stroke="#EAEDF2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #EAEDF2;">Trends</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 13l1.5-4.5A2 2 0 0 1 7.4 7h7.2a2 2 0 0 1 1.9 1.5L18 13v4h-2.5v-1.5h-9V17H4v-4z" stroke="#98A2B3" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Garage</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
