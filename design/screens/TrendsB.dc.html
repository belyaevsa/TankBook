<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #4FC3E8; } a:hover { color: #7ED4EF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #101318; color: #EAEDF2; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 64px 20px 12px;">
    <div style="font-family: 'Archivo', sans-serif; font-stretch: 82%; font-weight: 800; font-size: 20px;">Trends</div>
    <div style="display: flex; align-items: center; gap: 6px; background: #1A1F27; border: 1px solid #232A36; border-radius: 999px; padding: 6px 12px;">
      <span style="font-size: 12px; font-weight: 600;">Volvo V60</span>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 4l3 3 3-3" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 20px;">
    <div style="background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 14px;">
      <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #98A2B3;">Consumption</div>
      <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 4px;">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums;">6.8</span>
        <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">L/100</span>
      </div>
      <svg width="130" height="30" viewBox="0 0 130 30" fill="none" style="display: block; margin-top: 8px;">
        <path d="M2 22 L20 16 L38 19 L56 12 L74 15 L92 9 L110 12 L128 6" stroke="#F4503A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="128" cy="6" r="3" fill="#F4503A"/>
      </svg>
    </div>
    <div style="background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 14px;">
      <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #98A2B3;">Cost / km</div>
      <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 4px;">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums;">0.19</span>
        <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">€</span>
      </div>
      <svg width="130" height="30" viewBox="0 0 130 30" fill="none" style="display: block; margin-top: 8px;">
        <path d="M2 12 L20 15 L38 11 L56 16 L74 14 L92 18 L110 15 L128 17" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="128" cy="17" r="3" fill="#98A2B3"/>
      </svg>
    </div>
    <div style="background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 14px;">
      <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #98A2B3;">Spend · Aug</div>
      <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 4px;">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums;">€212</span>
      </div>
      <svg width="130" height="30" viewBox="0 0 130 30" fill="none" style="display: block; margin-top: 8px;">
        <rect x="2" y="14" width="10" height="14" rx="2" fill="#3A4354"/>
        <rect x="18" y="10" width="10" height="18" rx="2" fill="#3A4354"/>
        <rect x="34" y="16" width="10" height="12" rx="2" fill="#3A4354"/>
        <rect x="50" y="7" width="10" height="21" rx="2" fill="#3A4354"/>
        <rect x="66" y="12" width="10" height="16" rx="2" fill="#3A4354"/>
        <rect x="82" y="4" width="10" height="24" rx="2" fill="#3A4354"/>
        <rect x="98" y="9" width="10" height="19" rx="2" fill="#3A4354"/>
        <rect x="114" y="15" width="10" height="13" rx="2" fill="#F4503A"/>
      </svg>
    </div>
    <div style="background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 14px;">
      <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #98A2B3;">Price / L</div>
      <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 4px;">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 78%; font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums;">1.679</span>
        <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">▲3%</span>
      </div>
      <svg width="130" height="30" viewBox="0 0 130 30" fill="none" style="display: block; margin-top: 8px;">
        <path d="M2 20 L20 22 L38 18 L56 20 L74 15 L92 17 L110 12 L128 9" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="128" cy="9" r="3" fill="#98A2B3"/>
      </svg>
    </div>
  </div>

  <div style="margin: 16px 20px 0; background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #98A2B3;">Household · €/100 km</span>
      <span style="font-size: 10px; color: #5A6474;">Aug</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 14px;">
      <div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;">
          <span style="font-weight: 600;">Volvo V60 <span style="color: #98A2B3; font-weight: 400;">· diesel</span></span>
          <span style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-variant-numeric: tabular-nums;">11.40&thinsp;€</span>
        </div>
        <div style="height: 10px; border-radius: 5px; background: #232A36; overflow: hidden;">
          <div style="width: 92%; height: 100%; border-radius: 5px; background: #F4503A;"></div>
        </div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;">
          <span style="font-weight: 600;">ID.4 <span style="color: #98A2B3; font-weight: 400;">· electric</span></span>
          <span style="font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 700; font-variant-numeric: tabular-nums;">4.90&thinsp;€</span>
        </div>
        <div style="height: 10px; border-radius: 5px; background: #232A36; overflow: hidden;">
          <div style="width: 40%; height: 100%; border-radius: 5px; background: #4FC3E8;"></div>
        </div>
      </div>
    </div>
    <div style="font-size: 12px; color: #98A2B3; margin-top: 12px;">The EV costs 2.3× less per 100 km this month.</div>
  </div>

  <div style="margin: 14px 20px 0; background: #1A1F27; border: 1px solid #232A36; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1;">
      <div style="font-size: 12px; font-weight: 600;">Shell vs Neste</div>
      <div style="font-size: 12px; color: #98A2B3; margin-top: 2px;">Shell averages 4% more per liter this year</div>
    </div>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l5 4-5 4" stroke="#98A2B3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div style="flex: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: space-around; padding: 10px 12px 28px; border-top: 1px solid #1C222C; background: #0D1015;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 6h14M4 11h14M4 16h9" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Log</span>
    </div>
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #F4503A; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(244,80,58,0.35); margin-top: -22px;">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="8.5" stroke="#FFF2EE" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#FFF2EE"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3.5 16l4.5-5 3.5 3 6.5-8" stroke="#EAEDF2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #EAEDF2;">Trends</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 13l1.5-4.5A2 2 0 0 1 7.4 7h7.2a2 2 0 0 1 1.9 1.5L18 13v4h-2.5v-1.5h-9V17H4v-4z" stroke="#98A2B3" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #98A2B3;">Garage</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
