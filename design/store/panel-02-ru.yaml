name: store-02-ru

canvas:
  width: 1290
  height: 2796
  background: "#101318"
  padding: 96
  gap: 24
  columns: 12
  rows: 24

style:
  artStyle: flat vector, minimal, high contrast
  colors: ["#F4503A", "#4FC3E8", "#4FD18C"]
  background: "#101318"
  dark: true

layers:
  - id: wash
    source: fill
    area: {cols: 1-12, rows: 1-6}
    color: "#161C25"
    radius: 32

  - id: kicker
    source: text
    area: {cols: 1-12, rows: 1}
    text: "ЦИФРЫ МОЖНО ПРОВЕРИТЬ"
    role: caption
    font: {vAlign: bottom, align: center, color: "#FF8A75"}

  - id: headline
    source: text
    area: {cols: 1-12, rows: 2-4}
    text: "Литры x цена - проверка на экране"
    role: display
    fitText: balance
    font: {vAlign: middle, align: center, color: "#EAEDF2"}

  - id: caption
    source: text
    area: {cols: 1-12, rows: 5-6}
    text: "Если три числа не сходятся, приложение скажет прямо. Ничего не правится втихую."
    role: subtitle
    fitText: shrink
    font: {vAlign: top, align: center, color: "#9FB0C4"}

  - id: device
    source: image
    area: {cols: 1-12, rows: 7-24}
    path: ../screenshots/P2.3-confirm-ru.png
    fit: contain
    radius: 40
