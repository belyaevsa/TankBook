[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-reader"
version = "0.1.0"
description = "Synthetic seven-segment pump-display renderer (PU.1)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = [
    "torch>=2.2",
    "coremltools>=8.0",
    "numpy>=1.26",
    "pillow>=10",
    "pillow-heif>=0.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
