# Tankbook XcodeGen spec (P1.1).
# Source of truth for the Xcode project; `Tankbook.xcodeproj` is generated and
# gitignored, never committed. Regenerate with `xcodegen generate`.
#
# The app target depends on the local TankbookCore SwiftPM package at ios/;
# do not copy code out of it. Deployment target stays 18.0 (iPhone 12 is a
# hard requirement, docs/VISION.md) even though P1 develops on the iOS 26.5
# simulator - an 18.0 target makes post-18 API use a compile error without an
# @available guard.

name: Tankbook
options:
  bundleIdPrefix: app.tankbook
  createIntermediateGroups: true

packages:
  TankbookCore:
    path: ios

targets:
  Tankbook:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios/App/Sources
      - path: ios/App/Resources
    dependencies:
      - package: TankbookCore
        product: TankbookCore
    info:
      path: ios/App/Info.plist
      properties:
        CFBundleDisplayName: Tankbook
        # Three components on purpose. AppVersion parses dotted numerics with
        # exactly three parts, and P6.18's update requirement FAILS OPEN on
        # anything it cannot parse - so a two-component "1.0" makes every real
        # install resolve .none and the notice can never fire. The behaviour is
        # correct; the version string was the thing making it inert.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Google sign-in's iOS client id (SH.4). A PUBLIC identifier, not a
        # secret - docs/SECURITY.md says so explicitly, and hard rule 11 is
        # about keys, not identities. Unset here on purpose: until SH.1
        # registers a real OAuth client, the build ships without it and the
        # Sign in screen offers no Google button at all. Measured: with the
        # setting undefined, Xcode expands this to an EMPTY string rather than
        # leaving the literal, and GoogleOAuth.Configuration.provisioned refuses
        # both shapes.
        GoogleClientID: "$(TANKBOOK_GOOGLE_CLIENT_ID)"
        NSCameraUsageDescription: "Tankbook uses the camera to scan receipts and pump displays so you do not have to type them."
        NSPhotoLibraryUsageDescription: "Tankbook uses your photo library so you can log a receipt from an existing photo when the camera is not available."
    entitlements:
      # The file at this path is GENERATED from `properties` on every
      # `xcodegen generate` - it is not a file to hand-edit. Editing
      # ios/App/Tankbook.entitlements directly looks like it works (plutil
      # confirms the key, the app builds) and is silently reverted by the next
      # generate, which is how it sat empty until 2026-09-02.
      path: ios/App/Tankbook.entitlements
      properties:
        # Sign in with Apple. Must match the capability enabled on the App ID in
        # the developer portal; without it ASAuthorizationController fails at
        # RUNTIME on a real build, and Apple is currently the app's only working
        # provider (Google ships unprovisioned, SH.4). The failure reads as
        # "sign-in is broken", nowhere near a missing entitlement - and neither
        # the test suite nor the simulator enforces entitlements, so nothing
        # else catches it.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # Signing (docs/STORE.md -> Release checklist). Automatic: Xcode creates
        # and refreshes the distribution certificate and the App Store profile on
        # archive (-allowProvisioningUpdates), so nothing is registered by hand.
        # The team id is an environment variable, not a literal - the repo is
        # public-by-construction and the id belongs to the machine that
        # archives. `xcodegen generate` substitutes it; unset, simulator builds
        # still work (no signing needed) and an archive fails loudly.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "${TANKBOOK_TEAM_ID}"
        # The build number is stamped by scripts/release.sh from the commit
        # count (monotonic on main); this default is what a local Debug build gets.
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        # Pinned rather than inherited. Xcode's Release default is already
        # dwarf-with-dsym, but a silent flip to plain "dwarf" produces
        # unsymbolicated addresses in Organizer months later, with nothing
        # reporting the change. Crash reports are the ONLY production signal
        # this app has - there is no crash SDK - so the dSYM is load bearing.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        TARGETED_DEVICE_FAMILY: "1"
        # The app icon lives in ios/App/Resources/Assets.xcassets (light / dark /
        # tinted, iOS 18 single-size). Rendered from site/static/icon.svg - the
        # DESIGN.md mark - so the store page and the home screen show one logo.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Google sign-in in a DEBUG build uses a well-formed placeholder client
        # id, so the Sign in screen renders its real two-provider layout for the
        # UI suite and the screenshots, and the J11a wrong-provider question -
        # which only makes sense when a second provider exists - stays
        # reachable. The browser flow itself would fail at Google's end with
        # this id, which is correct: a developer build has no OAuth client, and
        # the UI tests inject a stub provider rather than driving the browser.
        #
        # RELEASE defines no such setting, so GoogleClientID ships EMPTY unless
        # the environment supplies one - a shipped build with no registered
        # OAuth client offers **Apple alone** rather than a button that fails -
        # which is SH.4's recommendation, reached by construction instead of by
        # remembering. SH.1 sets the variable when the client is registered.
        debug:
          TANKBOOK_GOOGLE_CLIENT_ID: "000000000000-debugplaceholder.apps.googleusercontent.com"

  TankbookUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios/App/UITests
    dependencies:
      - target: Tankbook
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Tankbook
        GENERATE_INFOPLIST_FILE: YES

  # App-target unit tests (L2): hosted in Tankbook so they run inside the app's
  # sandbox, where the app's own Application Support and attachment paths exist.
  # FileProtectionTests (PR.16) is the first occupant; it must never be moved to
  # the SwiftPM core tests, which run on macOS.
  TankbookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios/App/Tests
    dependencies:
      - target: Tankbook
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tankbook.app/Tankbook"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tankbook:
    build:
      targets:
        Tankbook: all
        TankbookUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TankbookTests
        - TankbookUITests
