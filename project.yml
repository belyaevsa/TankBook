# Tankbook XcodeGen spec (P1.1).
# Source of truth for the Xcode project; `Tankbook.xcodeproj` is generated and
# gitignored, never committed. Regenerate with `xcodegen generate`.
#
# The app target depends on the local TankbookCore SwiftPM package at ios/;
# do not copy code out of it. Deployment target stays 18.0 (iPhone 12 is a
# hard requirement, docs/VISION.md) even though P1 develops on the iOS 26.5
# simulator - an 18.0 target makes post-18 API use a compile error without an
# @available guard.

name: Tankbook
options:
  bundleIdPrefix: app.tankbook
  createIntermediateGroups: true

packages:
  TankbookCore:
    path: ios

targets:
  Tankbook:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios/App/Sources
      - path: ios/App/Resources
    dependencies:
      - package: TankbookCore
        product: TankbookCore
    info:
      path: ios/App/Info.plist
      properties:
        CFBundleDisplayName: Tankbook
        # Three components on purpose. AppVersion parses dotted numerics with
        # exactly three parts, and P6.18's update requirement FAILS OPEN on
        # anything it cannot parse - so a two-component "1.0" makes every real
        # install resolve .none and the notice can never fire. The behaviour is
        # correct; the version string was the thing making it inert.
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Tankbook uses the camera to scan receipts, pump displays and fiscal QR codes so you do not have to type them."
        NSPhotoLibraryUsageDescription: "Tankbook uses your photo library so you can log a receipt from an existing photo when the camera is not available."
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # Pinned rather than inherited. Xcode's Release default is already
        # dwarf-with-dsym, but a silent flip to plain "dwarf" produces
        # unsymbolicated addresses in Organizer months later, with nothing
        # reporting the change. Crash reports are the ONLY production signal
        # this app has - there is no crash SDK - so the dSYM is load bearing.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        TARGETED_DEVICE_FAMILY: "1"
        # The app icon lives in ios/App/Resources/Assets.xcassets (light / dark /
        # tinted, iOS 18 single-size). Rendered from site/static/icon.svg - the
        # DESIGN.md mark - so the store page and the home screen show one logo.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TankbookUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios/App/UITests
    dependencies:
      - target: Tankbook
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Tankbook
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tankbook:
    build:
      targets:
        Tankbook: all
        TankbookUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TankbookUITests
