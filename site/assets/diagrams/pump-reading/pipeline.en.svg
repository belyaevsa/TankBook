<svg viewBox="0 0 720 690" role="img" aria-label="The nine-step pipeline" class="diagram-svg" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pr-ar-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-soft)"/></marker></defs>
      
      <g font-size="14" fill="var(--ink)">
        <g>
          <rect x="20" y="14" width="430" height="50" rx="8" fill="var(--dash)" stroke="var(--tab-bar-border)"/>
          <text x="36" y="35" font-weight="600">1 · The photo</text>
          <text x="36" y="54" fill="var(--ink-soft)" font-size="13">12 MP, the EXIF rotation baked into the pixels</text>
        </g>
        <g>
          <rect x="20" y="86" width="430" height="50" rx="8" fill="var(--dash)" stroke="var(--tab-bar-border)"/>
          <text x="36" y="107" font-weight="600">2 · Finding the digit rows (RowSeg)</text>
          <text x="36" y="126" fill="var(--ink-soft)" font-size="13">a per-pixel network → rotated row rectangles</text>
        </g>
        <g>
          <rect x="20" y="158" width="430" height="50" rx="8" fill="var(--dash)" stroke="var(--tab-bar-border)"/>
          <text x="36" y="179" font-weight="600">3 · A pump or not</text>
          <text x="36" y="198" fill="var(--ink-soft)" font-size="13">≥ 2 large rows stacked; otherwise the slow path</text>
          <path d="M450,183 H548" stroke="var(--ink-soft)" stroke-width="1.5" marker-end="url(#pr-ar-pipeline)"/>
          <text x="462" y="175" fill="var(--ink-soft)" font-size="12">no</text>
          <rect x="554" y="158" width="146" height="50" rx="8" fill="none" stroke="var(--tab-bar-border)" stroke-dasharray="4 4"/>
          <text x="568" y="179" font-weight="600" font-size="13">Receipt path</text>
          <text x="568" y="197" fill="var(--ink-soft)" font-size="12">OCR + line parsing</text>
        </g>
        <g>
          <rect x="20" y="230" width="430" height="50" rx="8" fill="var(--dash)" stroke="var(--tab-bar-border)"/>
          <text x="36" y="251" font-weight="600">4 · Checking each row's geometry</text>
          <text x="36" y="270" fill="var(--ink-soft)" font-size="13">cells, pitch, ink band, keypad, duplicates</text>
        </g>
        <g>
          <rect x="20" y="302" width="430" height="50" rx="8" fill="var(--dash)" stroke="var(--tab-bar-border)"/>
          <text x="36" y="323" font-weight="600">5 · Row roles</text>
          <text x="36" y="342" fill="var(--ink-soft)" font-size="13">tilt undone; price board set aside; column read top down</text>
        </g>
        <g>
          <rect x="20" y="374" width="430" height="50" rx="8" fill="var(--dash)" stroke="var(--tab-bar-border)"/>
          <text x="36" y="395" font-weight="600">6 · Straightening the strip</text>
          <text x="36" y="414" fill="var(--ink-soft)" font-size="13">homography: quadrilateral → a straight 96 px strip</text>
        </g>
        <g>
          <rect x="20" y="446" width="430" height="50" rx="8" fill="var(--dash)" stroke="var(--tab-bar-border)"/>
          <text x="36" y="467" font-weight="600">7 · Reading the whole row (RowRead)</text>
          <text x="36" y="486" fill="var(--ink-soft)" font-size="13">CRNN + CTC → digits with every alternative's probability</text>
        </g>
        <g>
          <rect x="20" y="518" width="430" height="58" rx="8" fill="var(--dash)" stroke="var(--taillight)" stroke-width="1.5"/>
          <text x="36" y="539" font-weight="600">8 · The law of reading</text>
          <text x="36" y="557" fill="var(--ink-soft)" font-size="13">litres × price = total to the cent, the currency's format,</text>
          <text x="36" y="572" fill="var(--ink-soft)" font-size="13">one digit fix; nothing closes – the best read, with a warning</text>
          <path d="M450,547 H548" stroke="var(--ink-soft)" stroke-width="1.5" marker-end="url(#pr-ar-pipeline)"/>
          <text x="462" y="539" fill="var(--ink-soft)" font-size="12">offered</text>
          <rect x="554" y="522" width="146" height="50" rx="8" fill="none" stroke="var(--taillight)"/>
          <text x="568" y="543" font-weight="600" font-size="13">Confirm</text>
          <text x="568" y="561" fill="var(--ink-soft)" font-size="12">screen</text>
        </g>
        <g>
          <rect x="20" y="608" width="430" height="58" rx="8" fill="none" stroke="var(--tab-bar-border)" stroke-dasharray="4 4"/>
          <text x="36" y="629" font-weight="600">9 · Nothing offered → turn 90° / 270°</text>
          <text x="36" y="647" fill="var(--ink-soft)" font-size="13">the best turn by geometry, then steps 2–8 again;</text>
          <text x="36" y="662" fill="var(--ink-soft)" font-size="13">its result is used only if it offers something</text>
        </g>
        <g stroke="var(--ink-soft)" stroke-width="1.5">
          <path d="M235,64 V84" marker-end="url(#pr-ar-pipeline)"/>
          <path d="M235,136 V156" marker-end="url(#pr-ar-pipeline)"/>
          <path d="M235,208 V228" marker-end="url(#pr-ar-pipeline)"/>
          <path d="M235,280 V300" marker-end="url(#pr-ar-pipeline)"/>
          <path d="M235,352 V372" marker-end="url(#pr-ar-pipeline)"/>
          <path d="M235,424 V444" marker-end="url(#pr-ar-pipeline)"/>
          <path d="M235,496 V516" marker-end="url(#pr-ar-pipeline)"/>
          <path d="M235,576 V606" marker-end="url(#pr-ar-pipeline)"/>
          <text x="244" y="596" fill="var(--ink-soft)" font-size="12" stroke="none">nothing offered</text>
        </g>
      </g>
    </svg>