{{- with .Params -}}
<section class="section section--roadmap" id="roadmap">
  <div class="container">
    <div class="roadmap-card">
      <div>
        <p class="roadmap-card__eyebrow">{{ .road_eyebrow }}</p>
        <h2 class="roadmap-card__title">{{ .road_title }}</h2>
        <p class="roadmap-card__text">{{ .road_text }}</p>
      </div>
      <a class="btn btn--ghost" href="{{ .road_cta_url }}">{{ .road_cta }}</a>
    </div>
  </div>
</section>
{{- end -}}
