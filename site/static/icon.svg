  <!-- nozzle grip, rounded, with the spout reaching left -->
  <path fill="#F4503A" d="M20.7 7h5.6a3.2 3.2 0 0 1 3.2 3.2v17.6a3.2 3.2 0 0 1-3.2 3.2h-5.6a3.2 3.2 0 0 1-3.2-3.2V10.2A3.2 3.2 0 0 1 20.7 7Z"/>
  <path fill="#F4503A" d="M12.1 11.5h7.9v6h-7.9a2.3 2.3 0 0 1-2.3-2.3v-1.4a2.3 2.3 0 0 1 2.3-2.3Z"/>
  <!-- hose falling from the grip and finishing in the checkmark -->
  <path fill="none" stroke="#F4503A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M23.5 31v4.2c0 2.1 1.7 3.8 3.8 3.8h3.2l5 4.5 9.5-10.5"/>
