<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
  <!-- App icon per docs/DESIGN.md (2026-08-30, product owner): a gas pistol and a
       charging plug facing each other inside a frame. taillight = fuel,
       headlight = electric, ink frame on midnight. No text. Full-bleed: iOS and
       the site mask the corners. Single source of the mark: the app icon set
       and the site favicons render from this file. -->
  <rect width="52" height="52" fill="#101318"/>
  <rect x="5" y="5" width="42" height="42" rx="9" fill="none" stroke="#EAEDF2" stroke-opacity="0.55" stroke-width="2"/>
  <g transform="translate(26 26) scale(1.12) translate(-26 -27)">
    <!-- gas pistol: barrel, spout, grip, trigger -->
    <path fill="#F4503A" d="M9.5 17.5h11.5a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-2.5 2.5H9.5a2.5 2.5 0 0 1-2.5-2.5v-5a2.5 2.5 0 0 1 2.5-2.5Z"/>
    <path fill="#F4503A" d="M23.5 20h3.5v5h-3.5z"/>
    <path fill="#F4503A" d="M9 27.5h6.5l-2 9.5a2 2 0 0 1-2 1.6H9.8a1.8 1.8 0 0 1-1.8-2.1z"/>
    <path fill="none" stroke="#F4503A" stroke-width="2" stroke-linecap="round" d="M16.5 27.5v2.8a1.5 1.5 0 0 0 1.5 1.5h1"/>
    <!-- plug: body, two prongs toward the pistol, cord down -->
    <path fill="#4FC3E8" d="M35.5 15h6a2.8 2.8 0 0 1 2.8 2.8v9.4a2.8 2.8 0 0 1-2.8 2.8h-6a2.8 2.8 0 0 1-2.8-2.8v-9.4a2.8 2.8 0 0 1 2.8-2.8Z"/>
    <path fill="none" stroke="#4FC3E8" stroke-width="2.8" stroke-linecap="round" d="M32.7 19.2h-4M32.7 25.8h-4"/>
    <path fill="none" stroke="#4FC3E8" stroke-width="2.8" stroke-linecap="round" d="M38.5 30v5.2c0 1.6-1 2.6-2.6 2.6"/>
  </g>
</svg>
